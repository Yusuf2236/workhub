name: WorkHub CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Download Go Modules
        working-directory: backend
        run: go mod download

      - name: Run Go Tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Go Backend Binary
        working-directory: backend
        run: CGO_ENABLED=0 go build -v -o bin/workhub-api ./cmd/api

  frontend:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js Production App
        working-directory: web
        run: npm run build
