name: WorkHub CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Download Go Modules
        working-directory: backend
        run: go mod download

      - name: Run Go Tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Go Backend Binary
        working-directory: backend
        run: CGO_ENABLED=0 go build -v -o bin/workhub-api ./cmd/api

  backend-integration:
    name: Backend Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d workhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      # Runs every migration on an empty database and drives the API through real SQL
      - name: Run Integration Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/workhub_test?sslmode=disable
        run: go test -tags integration -count=1 -v ./cmd/api/

  frontend:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js Production App
        working-directory: web
        run: npm run build

  admin:
    name: Admin Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        working-directory: admin
        run: npm ci

      - name: Build Admin Panel App
        working-directory: admin
        run: npm run build
