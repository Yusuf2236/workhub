<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WZone — iOS & Android Mobile Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 15%, #191a27 0%, #0d0e14 65%, #07070a 100%);
      color: #e2e8f0;
      user-select: none;
      overflow-x: hidden;
    }

    /* Floating Center Button Aura Glow (Oq ramkasiz) */
    .aura-glow {
      box-shadow: 0 0 28px 10px rgba(108, 71, 216, 0.42), 0 6px 18px rgba(108, 71, 216, 0.4);
    }

    /* Device Shadows */
    .iphone-frame {
      box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.9), 0 0 0 12px #26272b, 0 0 0 14px #3d3e45;
    }

    .android-frame {
      box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.9), 0 0 0 11px #1d2026, 0 0 0 13px #373a42;
    }

    /* Custom Scrollbar */
    .phone-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: rgba(140, 140, 160, 0.25);
      border-radius: 9999px;
    }

    /* Sheet transitions */
    .sheet-anim {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    /* ============================================== */
    /* SPLASH LAUNCH ANIMATION KEYFRAMES               */
    /* ============================================== */
    @keyframes shimmerPass {
      0% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(250%) skewX(-20deg); }
    }
    .shimmer-active {
      animation: shimmerPass 1.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Step 1: W paydo bo'lishi */
    .w-enter-anim {
      animation: wEntrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes wEntrance {
      0% { transform: scale(0.6); opacity: 0; filter: blur(6px); }
      60% { transform: scale(1.08); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Step 2: W yaqinlashib, katta bo'lib ochilishi (Zoom In) */
    .w-zoom-in-anim {
      animation: wZoomIn 0.8s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
    @keyframes wZoomIn {
      0% { transform: scale(1); opacity: 1; filter: blur(0px); }
      30% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(16); opacity: 0; filter: blur(14px); }
    }

    /* Step 3: Ilova silliq ochilishi */
    .app-reveal-anim {
      animation: appReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes appReveal {
      0% { transform: scale(0.92); opacity: 0; filter: blur(4px); }
      100% { transform: scale(1); opacity: 1; filter: blur(0px); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Toolbar with Replay Animation Button -->
  <header class="h-14 px-6 flex items-center justify-between border-b border-white/10 bg-black/40 backdrop-blur-md sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#5e35b1] to-[#7c4dff] flex items-center justify-center font-black text-white text-xs shadow-md shadow-purple-900/50">
        WZ
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-tight flex items-center gap-2">
          <span>WZone Mobile Studio</span>
          <span class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">Port 3020</span>
        </h1>
      </div>
    </div>

    <!-- Center Action: REPLAY LAUNCH SPLASH ANIMATION BUTTON -->
    <div class="flex items-center space-x-2">
      <button onclick="replayAllSplash()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-[#6C47D8] via-[#7e52f0] to-[#a855f7] hover:opacity-95 text-white font-black text-xs flex items-center gap-2 shadow-lg shadow-purple-900/50 active:scale-95 transition transform hover:scale-[1.02]">
        <i class="fa-solid fa-play text-[10px]"></i>
        <span>🎬 Ilovaga Kirish Animatsiyasi (Replay)</span>
      </button>
    </div>

    <!-- Quick Controls & Switcher -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 bg-white/5 p-1 rounded-xl border border-white/10 text-xs font-semibold">
        <button onclick="setDeviceView('dual')" id="btn-dual" class="px-3 py-1.5 rounded-lg bg-[#6C47D8] text-white shadow-sm transition">
          ⚡ Dual
        </button>
        <button onclick="setDeviceView('ios')" id="btn-ios" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          🍏 iOS
        </button>
        <button onclick="setDeviceView('android')" id="btn-android" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">
          🤖 Android
        </button>
      </div>

      <!-- Scale Control -->
      <div class="flex items-center space-x-2 text-xs text-zinc-400 bg-white/5 px-2.5 py-1.5 rounded-xl border border-white/10">
        <button onclick="adjustScale(-0.05)" class="hover:text-white px-1 font-bold text-sm">−</button>
        <span id="scale-indicator" class="font-mono text-zinc-200 w-10 text-center">90%</span>
        <button onclick="adjustScale(0.05)" class="hover:text-white px-1 font-bold text-sm">+</button>
      </div>
    </div>
  </header>

  <!-- Main Canvas Container -->
  <main class="flex-1 flex items-center justify-center p-6 md:p-12 overflow-x-auto">
    <div id="devices-container" class="flex flex-wrap items-center justify-center gap-12 transition-transform duration-200 origin-center" style="transform: scale(0.9);">

      <!-- ============================================== -->
      <!-- 1. APPLE IPHONE 16 PRO (iOS)                   -->
      <!-- ============================================== -->
      <div id="wrapper-ios" class="flex flex-col items-center space-y-3">
        <div class="flex items-center justify-between w-full px-2 text-xs text-zinc-400 font-mono">
          <span class="flex items-center gap-1.5"><i class="fa-brands fa-apple text-sm text-zinc-300"></i> Apple iPhone 16 Pro</span>
          <button onclick="playSplashSequence('ios')" class="text-[11px] text-purple-300 bg-purple-950/60 hover:bg-purple-900/80 px-2 py-0.5 rounded border border-purple-800/40 flex items-center gap-1">
            <i class="fa-solid fa-rotate-right text-[9px]"></i> <span>Splash iOS</span>
          </button>
        </div>

        <!-- Phone Outer Frame -->
        <div class="w-[392px] h-[835px] bg-black rounded-[54px] p-3.5 iphone-frame relative flex flex-col overflow-hidden">
          
          <!-- Dynamic Island -->
          <div class="absolute top-4 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-50 flex items-center justify-end pr-2 space-x-1 pointer-events-none">
            <span class="w-2.5 h-2.5 rounded-full bg-[#18181a]"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-[#1e1035]"></span>
          </div>

          <!-- Screen Inner Content -->
          <div class="w-full h-full bg-[#f6f5fb] rounded-[44px] overflow-hidden flex flex-col relative text-zinc-800">
            
            <!-- ============================================== -->
            <!-- 🎬 iOS LAUNCH SPLASH OVERLAY (W ochiladi, kattalashadi) -->
            <!-- ============================================== -->
            <div id="ios-splash" class="absolute inset-0 z-50 bg-[#0c061a] flex flex-col items-center justify-center overflow-hidden transition-opacity duration-400">
              <!-- Soft atmospheric glow aura -->
              <div class="absolute w-80 h-80 rounded-full bg-[#6C47D8]/30 blur-3xl pointer-events-none"></div>

              <!-- Animated Logo Container -->
              <div id="ios-splash-box" class="relative z-10 flex flex-col items-center text-center">
                <!-- Glowing 'W' Icon (Scales and zooms in) -->
                <div id="ios-splash-w" class="w-24 h-24 rounded-[30px] bg-gradient-to-tr from-[#4a1fb8] via-[#6C47D8] to-[#9d6fff] flex items-center justify-center shadow-[0_0_60px_rgba(108,71,216,0.9)] border border-white/20 relative overflow-hidden w-enter-anim">
                  <div class="absolute inset-0 w-1/2 h-full bg-gradient-to-r from-transparent via-white/50 to-transparent skew-x-12 shimmer-active"></div>
                  <span class="text-6xl font-black text-white tracking-tighter drop-shadow-md select-none font-sans">W</span>
                </div>

                <div id="ios-splash-text" class="mt-4 transition-all duration-300">
                  <h2 class="text-xl font-black text-white tracking-tight">WZone</h2>
                  <p class="text-[11px] text-purple-300/80 font-medium tracking-wide mt-0.5">O‘zbekiston vakansiyalar ekotizimi</p>
                </div>
              </div>
            </div>

            <!-- iOS Main Application Body (Reveals after Splash) -->
            <div id="ios-app-container" class="w-full h-full flex flex-col relative">
              
              <!-- iOS Status Bar -->
              <div class="h-11 px-7 pt-3 flex justify-between items-center text-xs font-semibold text-zinc-900 select-none z-30 shrink-0">
                <span class="font-bold">9:41</span>
                <div class="flex items-center space-x-1.5 text-[10.5px]">
                  <i class="fa-solid fa-signal"></i>
                  <i class="fa-solid fa-wifi"></i>
                  <i class="fa-solid fa-battery-full text-xs"></i>
                </div>
              </div>

              <!-- Scrollable Content -->
              <div id="ios-content-body" class="flex-1 overflow-y-auto phone-scroll px-4 pb-28 pt-2 space-y-4">
                <!-- Dynamically populated by renderScreen('ios', state.currentTab.ios) -->
              </div>

              <!-- ======================================================== -->
              <!-- ASOSIY BOTTOM NAVIGATION BAR (OQ RAMKASIZ '+' TUGMASI)   -->
              <!-- ======================================================== -->
              <div class="absolute bottom-0 left-0 right-0 z-40 select-none">
                
                <!-- Markaziy tugma nuri (Glow effekti) -->
                <div class="absolute left-1/2 -top-4 -translate-x-1/2 w-16 h-16 bg-[#6C47D8]/45 rounded-full blur-xl pointer-events-none"></div>

                <!-- Asosiy oq panel (32px yuqori burchaklar, Frosted Glass Blur) -->
                <div class="relative bg-white/90 backdrop-blur-xl rounded-t-[32px] shadow-[0_-4px_24px_rgba(0,0,0,0.06)] pt-2 pb-6 px-3 border-t border-purple-100/50">
                  
                  <div class="flex items-center justify-around relative">
                    
                    <!-- 1. Home (Faol: To'q binafsha #2E1C59) -->
                    <button onclick="switchScreen('home', 'ios')" id="ios-nav-home" class="flex flex-col items-center justify-center min-w-[58px] transition-all group py-1">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center transition">
                        <i class="fa-solid fa-house text-[21px] text-[#2E1C59]" id="ios-icon-home"></i>
                      </div>
                      <span class="text-[11px] font-bold text-[#2E1C59] tracking-tight mt-0.5" id="ios-label-home">Home</span>
                    </button>

                    <!-- 2. Vakansiyalar -->
                    <button onclick="switchScreen('vacancies', 'ios')" id="ios-nav-vacancies" class="flex flex-col items-center justify-center min-w-[58px] transition-all group py-1">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center transition">
                        <i class="fa-solid fa-briefcase text-[20px] text-[#8E8E93]" id="ios-icon-vacancies"></i>
                      </div>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="ios-label-vacancies">Vakansiyalar</span>
                    </button>

                    <!-- 3. Markaziy Floating '+' Tugmasi (OQ RAMKASIZ, toza binafsha aura) -->
                    <button onclick="openAddModal('ios')" id="ios-nav-add" class="flex items-center justify-center -mt-8 transition-transform duration-200 hover:scale-105 active:scale-95 group focus:outline-none z-50">
                      <div class="w-[56px] h-[56px] rounded-full bg-[#6C47D8] text-white flex items-center justify-center aura-glow transition-all">
                        <i class="fa-solid fa-plus text-2xl font-bold transition-transform duration-300 group-hover:rotate-90"></i>
                      </div>
                    </button>

                    <!-- 4. Arizalarim -->
                    <button onclick="switchScreen('applications', 'ios')" id="ios-nav-applications" class="flex flex-col items-center justify-center min-w-[58px] transition-all group py-1">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center transition">
                        <i class="fa-regular fa-clock text-[20px] text-[#8E8E93]" id="ios-icon-applications"></i>
                      </div>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="ios-label-applications">Arizalarim</span>
                    </button>

                    <!-- 5. Profil -->
                    <button onclick="switchScreen('profile', 'ios')" id="ios-nav-profile" class="flex flex-col items-center justify-center min-w-[58px] transition-all group py-1">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center transition">
                        <i class="fa-regular fa-user text-[20px] text-[#8E8E93]" id="ios-icon-profile"></i>
                      </div>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="ios-label-profile">Profil</span>
                    </button>

                  </div>

                  <!-- iOS Home Indicator Chizig'i -->
                  <div class="w-32 h-1 bg-zinc-900 rounded-full mx-auto mt-3.5 opacity-80"></div>
                </div>
              </div>

            </div>

            <!-- UNIVERSAL INTERACTIVE BOTTOM SHEET (iOS) -->
            <div id="ios-sheet-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-end">
              <div id="ios-sheet-panel" class="bg-white rounded-t-[36px] max-h-[92%] w-full overflow-hidden flex flex-col transform translate-y-full sheet-anim shadow-2xl p-5 pb-7 space-y-3">
                <div class="w-12 h-1.5 bg-zinc-300 rounded-full mx-auto -mt-2 cursor-pointer hover:bg-zinc-400 transition" onclick="closeSheet('ios')"></div>
                <div id="ios-sheet-content" class="overflow-y-auto phone-scroll space-y-3 pt-1 text-xs text-zinc-800 pr-1">
                  <!-- Dynamic content injected via openSheet('ios', type, data) -->
                </div>
              </div>
            </div>

            <!-- FLOATING TOAST (iOS) -->
            <div id="ios-toast" class="absolute top-12 left-4 right-4 z-50 bg-[#1C1335]/95 backdrop-blur-md text-white py-2.5 px-4 rounded-2xl shadow-xl flex items-center space-x-2.5 pointer-events-none transform -translate-y-8 opacity-0 transition-all duration-300 text-xs font-semibold">
              <i id="ios-toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
              <span id="ios-toast-msg">Muvaffaqiyatli!</span>
            </div>

          </div>
        </div>
      </div>


      <!-- ============================================== -->
      <!-- 2. ANDROID SAMSUNG GALAXY S24 (Android)        -->
      <!-- ============================================== -->
      <div id="wrapper-android" class="flex flex-col items-center space-y-3">
        <div class="flex items-center justify-between w-full px-2 text-xs text-zinc-400 font-mono">
          <span class="flex items-center gap-1.5"><i class="fa-brands fa-android text-sm text-emerald-400"></i> Samsung Galaxy S24 (Android)</span>
          <button onclick="playSplashSequence('android')" class="text-[11px] text-emerald-300 bg-emerald-950/60 hover:bg-emerald-900/80 px-2 py-0.5 rounded border border-emerald-800/40 flex items-center gap-1">
            <i class="fa-solid fa-rotate-right text-[9px]"></i> <span>Splash Android</span>
          </button>
        </div>

        <!-- Phone Outer Frame -->
        <div class="w-[392px] h-[835px] bg-[#0c0d11] rounded-[48px] p-3.5 android-frame relative flex flex-col overflow-hidden">
          
          <!-- Punch-hole front camera -->
          <div class="absolute top-3.5 left-1/2 -translate-x-1/2 w-4 h-4 bg-black rounded-full z-50 flex items-center justify-center pointer-events-none ring-1 ring-zinc-800">
            <span class="w-1.5 h-1.5 rounded-full bg-[#111625]"></span>
          </div>

          <!-- Screen Inner Content -->
          <div class="w-full h-full bg-[#f6f5fb] rounded-[38px] overflow-hidden flex flex-col relative text-zinc-800">
            
            <!-- ============================================== -->
            <!-- 🎬 ANDROID LAUNCH SPLASH OVERLAY                -->
            <!-- ============================================== -->
            <div id="android-splash" class="absolute inset-0 z-50 bg-[#0c061a] flex flex-col items-center justify-center overflow-hidden transition-opacity duration-400">
              <div class="absolute w-80 h-80 rounded-full bg-[#6C47D8]/30 blur-3xl pointer-events-none"></div>

              <div id="android-splash-box" class="relative z-10 flex flex-col items-center text-center">
                <div id="android-splash-w" class="w-24 h-24 rounded-[30px] bg-gradient-to-tr from-[#4a1fb8] via-[#6C47D8] to-[#9d6fff] flex items-center justify-center shadow-[0_0_60px_rgba(108,71,216,0.9)] border border-white/20 relative overflow-hidden w-enter-anim">
                  <div class="absolute inset-0 w-1/2 h-full bg-gradient-to-r from-transparent via-white/50 to-transparent skew-x-12 shimmer-active"></div>
                  <span class="text-6xl font-black text-white tracking-tighter drop-shadow-md select-none font-sans">W</span>
                </div>

                <div id="android-splash-text" class="mt-4 transition-all duration-300">
                  <h2 class="text-xl font-black text-white tracking-tight">WZone</h2>
                  <p class="text-[11px] text-purple-300/80 font-medium tracking-wide mt-0.5">Android Material 3 Ekotizim</p>
                </div>
              </div>
            </div>

            <!-- Android Main Application Body (Reveals after Splash) -->
            <div id="android-app-container" class="w-full h-full flex flex-col relative">

              <!-- Android Status Bar -->
              <div class="h-10 px-6 pt-2 flex justify-between items-center text-xs font-semibold text-zinc-900 select-none z-30 shrink-0">
                <span class="font-bold text-[11px]">12:30</span>
                <div class="flex items-center space-x-2 text-[10.5px]">
                  <span class="text-[9.5px] font-black text-purple-700">5G</span>
                  <i class="fa-solid fa-wifi text-[10px]"></i>
                  <i class="fa-solid fa-battery-three-quarters text-xs text-emerald-600"></i>
                </div>
              </div>

              <!-- Scrollable Content -->
              <div id="android-content-body" class="flex-1 overflow-y-auto phone-scroll px-4 pb-28 pt-1 space-y-4">
                <!-- Dynamically populated by renderScreen('android', state.currentTab.android) -->
              </div>

              <!-- ANDROID MATERIAL 3 BOTTOM NAV (OQ RAMKASIZ '+' TUGMASI) -->
              <div class="absolute bottom-0 left-0 right-0 z-40 select-none">
                
                <!-- Markaziy tugma nuri -->
                <div class="absolute left-1/2 -top-4 -translate-x-1/2 w-16 h-16 bg-[#6C47D8]/45 rounded-full blur-xl pointer-events-none"></div>

                <!-- Asosiy oq panel (32dp rounded top, Frosted Glass Blur) -->
                <div class="relative bg-white/90 backdrop-blur-xl rounded-t-[32px] shadow-[0_-4px_24px_rgba(0,0,0,0.06)] pt-2 pb-5 px-3 border-t border-purple-100/50">
                  <div class="flex items-center justify-around relative">
                    
                    <!-- 1. Home -->
                    <button onclick="switchScreen('home', 'android')" id="android-nav-home" class="flex flex-col items-center justify-center min-w-[58px] py-1">
                      <i class="fa-solid fa-house text-[21px] text-[#2E1C59]" id="android-icon-home"></i>
                      <span class="text-[11px] font-bold text-[#2E1C59] tracking-tight mt-0.5" id="android-label-home">Home</span>
                    </button>

                    <!-- 2. Vakansiyalar -->
                    <button onclick="switchScreen('vacancies', 'android')" id="android-nav-vacancies" class="flex flex-col items-center justify-center min-w-[58px] py-1">
                      <i class="fa-solid fa-briefcase text-[20px] text-[#8E8E93]" id="android-icon-vacancies"></i>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="android-label-vacancies">Vakansiyalar</span>
                    </button>

                    <!-- 3. Markaziy Floating '+' Tugmasi (OQ RAMKASIZ) -->
                    <button onclick="openAddModal('android')" class="flex items-center justify-center -mt-8 transition-transform duration-200 hover:scale-105 active:scale-95 group focus:outline-none z-50">
                      <div class="w-[56px] h-[56px] rounded-full bg-[#6C47D8] text-white flex items-center justify-center aura-glow transition-all">
                        <i class="fa-solid fa-plus text-2xl font-bold transition-transform duration-300 group-hover:rotate-90"></i>
                      </div>
                    </button>

                    <!-- 4. Arizalarim -->
                    <button onclick="switchScreen('applications', 'android')" id="android-nav-applications" class="flex flex-col items-center justify-center min-w-[58px] py-1">
                      <i class="fa-regular fa-clock text-[20px] text-[#8E8E93]" id="android-icon-applications"></i>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="android-label-applications">Arizalarim</span>
                    </button>

                    <!-- 5. Profil -->
                    <button onclick="switchScreen('profile', 'android')" id="android-nav-profile" class="flex flex-col items-center justify-center min-w-[58px] py-1">
                      <i class="fa-regular fa-user text-[20px] text-[#8E8E93]" id="android-icon-profile"></i>
                      <span class="text-[11px] font-medium text-[#8E8E93] tracking-tight mt-0.5" id="android-label-profile">Profil</span>
                    </button>

                  </div>

                  <!-- Android Gesture Navigation Bar -->
                  <div class="w-20 h-1 bg-zinc-900 rounded-full mx-auto mt-2.5 opacity-70"></div>
                </div>
              </div>

            </div>

            <!-- UNIVERSAL INTERACTIVE BOTTOM SHEET (Android) -->
            <div id="android-sheet-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-end">
              <div id="android-sheet-panel" class="bg-white rounded-t-[36px] max-h-[92%] w-full overflow-hidden flex flex-col transform translate-y-full sheet-anim shadow-2xl p-5 pb-7 space-y-3">
                <div class="w-12 h-1.5 bg-zinc-300 rounded-full mx-auto -mt-2 cursor-pointer hover:bg-zinc-400 transition" onclick="closeSheet('android')"></div>
                <div id="android-sheet-content" class="overflow-y-auto phone-scroll space-y-3 pt-1 text-xs text-zinc-800 pr-1">
                  <!-- Dynamic content injected via openSheet('android', type, data) -->
                </div>
              </div>
            </div>

            <!-- FLOATING TOAST (Android) -->
            <div id="android-toast" class="absolute top-12 left-4 right-4 z-50 bg-[#1C1335]/95 backdrop-blur-md text-white py-2.5 px-4 rounded-2xl shadow-xl flex items-center space-x-2.5 pointer-events-none transform -translate-y-8 opacity-0 transition-all duration-300 text-xs font-semibold">
              <i id="android-toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
              <span id="android-toast-msg">Muvaffaqiyatli!</span>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

    // Scale & View state

    function playSplashSequence(platform) {
      const splash = document.getElementById(`${platform}-splash`);
      const splashW = document.getElementById(`${platform}-splash-w`);
      const splashText = document.getElementById(`${platform}-splash-text`);
      const appContainer = document.getElementById(`${platform}-app-container`);
      if (!splash || !splashW || !appContainer) return;

      splash.style.display = 'flex';
      splash.style.opacity = '1';
      splash.style.pointerEvents = 'auto';
      if (splashText) splashText.style.opacity = '1';
      
      splashW.className = "w-24 h-24 rounded-[30px] bg-gradient-to-tr from-[#4a1fb8] via-[#6C47D8] to-[#9d6fff] flex items-center justify-center shadow-[0_0_60px_rgba(108,71,216,0.9)] border border-white/20 relative overflow-hidden w-enter-anim";
      
      appContainer.classList.remove('app-reveal-anim');
      appContainer.style.opacity = '0';

      setTimeout(() => {
        if (splashText) splashText.style.opacity = '0';
        splashW.classList.remove('w-enter-anim');
        splashW.classList.add('w-zoom-in-anim');
      }, 1000);

      setTimeout(() => {
        splash.style.opacity = '0';
        appContainer.style.opacity = '1';
        appContainer.classList.add('app-reveal-anim');
      }, 1450);

      setTimeout(() => {
        splash.style.display = 'none';
        splash.style.pointerEvents = 'none';
      }, 1900);
    }

    function replayAllSplash() {
      playSplashSequence('ios');

    async function loadProfileFromBackend(platform = 'ios') {
      state.profileLoading = true;
      const token = typeof localStorage !== 'undefined' ? localStorage.getItem('workhub_token') : null;
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      try {
        if (token) {
          // 1. Fetch live user details
          const meRes = await fetch(`${API_BASE}/auth/me`, { headers }).then(r => r.ok ? r.json() : null).catch(() => null);
          if (meRes && meRes.success && meRes.data && meRes.data.user) {
            const u = meRes.data.user;
            state.userProfile.id = u.id;
            state.userProfile.name = u.name || 'Foydalanuvchi';
            state.userProfile.email = u.email || '';
            state.userProfile.phone = u.phone || '';
            state.userProfile.title = u.profession || (u.account_type === 'company' ? (u.company_name || 'Ish beruvchi') : 'Mutaxassis');
            state.userProfile.location = u.location || 'Toshkent, O‘zbekiston';
            state.userProfile.experience = u.experience || '3+ yil';
            state.userProfile.expectedSalary = u.expected_salary || 'Kelishilgan';
            state.userProfile.pinfl = u.pinfl || '';
            state.userProfile.passport = u.passport_series ? `${u.passport_series} ${u.passport_number}` : 'Tasdiqlangan ✓';
            state.userProfile.bio = u.bio || '';
            state.userProfile.account_type = u.account_type || 'individual';
            state.userProfile.company_name = u.company_name || '';
            state.userProfile.inn = u.inn || '';
            state.userProfile.avatar_url = u.avatar_url || '';
            state.userProfile.status = u.is_verified ? 'OneID Tasdiqlangan ✓' : 'Faol profil';
            state.isLoggedIn = true;
            if (u.skills) {
              state.userProfile.skills = u.skills.split(',').map(s => s.trim()).filter(Boolean);
            }
          }

          // 2. Fetch extended profile settings & bio
          const profRes = await fetch(`${API_BASE}/profile`, { headers }).then(r => r.ok ? r.json() : null).catch(() => null);
          if (profRes && profRes.success && profRes.data && profRes.data.profile) {
            const p = profRes.data.profile;
            if (p.bio) state.userProfile.bio = p.bio;
            if (p.phone) state.userProfile.phone = p.phone;
            if (p.location) state.userProfile.location = p.location;
            if (p.avatar_url) state.userProfile.avatar_url = p.avatar_url;
            if (p.skills) {
              state.userProfile.skills = p.skills.split(',').map(s => s.trim()).filter(Boolean);
            }
          }

          // 3. Fetch real user applications
          const appRes = await fetch(`${API_BASE}/applications`, { headers }).then(r => r.ok ? r.json() : null).catch(() => null);
          if (appRes && appRes.success && appRes.data && Array.isArray(appRes.data.applications)) {
            state.applications = appRes.data.applications.map((a, i) => ({
              id: a.id || `app-${i+1}`,
              vacId: a.vacancy_id || 'vac-1',
              title: a.vacancy_title || a.title || 'Vakansiya',
              company: a.company_name || a.company || 'Kompaniya',
              location: a.location || 'Toshkent',
              salary: a.salary || 'Kelishilgan',
              appliedDate: a.created_at ? new Date(a.created_at).toLocaleDateString() : 'Yaqinda',
              status: a.status || 'review',
              statusText: a.status === 'accepted' ? 'Qabul qilindi 🎉' : (a.status === 'interview' ? 'Intervyu 📅' : "Ko'rib chiqilmoqda"),
              statusClass: a.status === 'accepted' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200',
              progress: a.status === 'accepted' ? 100 : (a.status === 'interview' ? 75 : 50),
              currentStep: a.status === 'accepted' ? 4 : (a.status === 'interview' ? 3 : 2),
              note: a.note || 'Ariza holati kuzatilmoqda'
            }));
          }
        } else {
          // Check cached local user from web
          const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('workhub_user') : null;
          if (cached) {
            try {
              const u = JSON.parse(cached);
              state.userProfile.id = u.id || '';
              state.userProfile.name = u.name || 'Nomzod';
              state.userProfile.email = u.email || '';
              state.userProfile.phone = u.phone || '';
              state.userProfile.title = u.profession || 'Mutaxassis';
              state.userProfile.location = u.location || 'Toshkent';
              state.userProfile.skills = (u.skills || '').split(',').map(s=>s.trim()).filter(Boolean);
              state.userProfile.status = u.is_verified ? 'OneID Tasdiqlangan ✓' : 'Faol nomzod';
              state.userProfile.pinfl = u.pinfl || '';
              state.userProfile.passport = u.passport_series ? `${u.passport_series} ${u.passport_number}` : '';
              state.isLoggedIn = true;
            } catch (_) {}
          } else {
            // Default unauthenticated state (ZERO hardcoded fake profile data)
            state.isLoggedIn = false;
            state.userProfile = {
              id: '',
              name: 'Mehmon',
              title: 'Tizimga kirmagan',
              phone: '',
              email: '',
              location: 'Toshkent',
              experience: '',
              expectedSalary: '',
              pinfl: '',
              passport: '',
              skills: [],
              bio: '',
              status: 'Mehmon',
              account_type: 'individual',
              company_name: '',
              inn: '',
              avatar_url: ''
            };
            state.applications = [];
            state.notifications = [];
          }
        }
      } catch (err) {
        console.warn('Backend profile fetch error:', err);
      } finally {
        state.profileLoading = false;
        if (state.currentTab[platform] === 'profile') {
          renderScreen(platform, 'profile');
        }
      }
    }

    async function saveProfileToBackend(platform) {
      const name = document.getElementById(`${platform}-edit-name`)?.value || state.userProfile.name;
      const phone = document.getElementById(`${platform}-edit-phone`)?.value || state.userProfile.phone;
      const title = document.getElementById(`${platform}-edit-title`)?.value || state.userProfile.title;
      const location = document.getElementById(`${platform}-edit-location`)?.value || state.userProfile.location;
      const bio = document.getElementById(`${platform}-edit-bio`)?.value || state.userProfile.bio;
      const skillsStr = document.getElementById(`${platform}-edit-skills`)?.value || state.userProfile.skills.join(', ');

      const token = typeof localStorage !== 'undefined' ? localStorage.getItem('workhub_token') : null;
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      try {
        await fetch(`${API_BASE}/profile`, {
          method: 'PUT',
          headers,
          body: JSON.stringify({ name, phone, location, bio, skills: skillsStr })
        });
      } catch (e) {
        console.warn('Backend save notice:', e);
      }

      state.userProfile.name = name;
      state.userProfile.phone = phone;
      state.userProfile.title = title;
      state.userProfile.location = location;
      state.userProfile.bio = bio;
      state.userProfile.skills = skillsStr.split(',').map(s => s.trim()).filter(Boolean);

      closeSheet(platform);
      showToast(platform, '✅ Profil backendda muvaffaqiyatli saqlandi!', 'fa-solid fa-circle-check text-emerald-400');
      renderScreen(platform, 'profile');
    }

      showToast(platform, 'Tizimdan chiqildi', 'fa-solid fa-arrow-right-from-bracket text-zinc-400');

    // ==============================================
    // 🎛️ TOAST NOTIFICATION CONTROLLER
    // ==============================================
    function showToast(platform, message, iconClass = 'fa-solid fa-circle-check text-emerald-400') {
      const toast = document.getElementById(`${platform}-toast`);
      const toastIcon = document.getElementById(`${platform}-toast-icon`);
      const toastMsg = document.getElementById(`${platform}-toast-msg`);
      if (!toast) return;

      toastIcon.className = iconClass;
      toastMsg.innerText = message;

      toast.classList.remove('opacity-0', '-translate-y-8', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-8', 'pointer-events-none');
      }, 2600);
    }

    // ==============================================
    // 📱 UNIVERSAL SHEET SYSTEM (OPEN / CLOSE)
    // ==============================================
    function openSheet(platform, type, data = null) {
      const overlay = document.getElementById(`${platform}-sheet-overlay`);
      const panel = document.getElementById(`${platform}-sheet-panel`);
      const content = document.getElementById(`${platform}-sheet-content`);
      if (!overlay || !panel || !content) return;

      content.innerHTML = getSheetContent(platform, type, data);

      overlay.classList.remove('pointer-events-none', 'opacity-0');
      panel.classList.remove('translate-y-full');
    }

    function closeSheet(platform) {
      const overlay = document.getElementById(`${platform}-sheet-overlay`);
      const panel = document.getElementById(`${platform}-sheet-panel`);
      if (!overlay || !panel) return;

      panel.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
    }

    function openAddModal(platform) {
      const activePlatform = platform || (!document.getElementById('wrapper-ios').classList.contains('hidden') ? 'ios' : 'android');
      openSheet(activePlatform, 'add_choice');

              <!-- Edit Profile (Opens real backend edit sheet) -->
              <div onclick="openSheet('${platform}', 'edit_profile')" class="p-3.5 flex items-center justify-between hover:bg-purple-50/50 cursor-pointer transition">

    // ==============================================
    // 🔘 TAB SWITCHER CONTROLLER
    // ==============================================
    function switchScreen(tabKey, platform) {
      state.currentTab[platform] = tabKey;
      const tabs = ['home', 'vacancies', 'applications', 'profile'];
      
      tabs.forEach(tab => {
        const icon = document.getElementById(`${platform}-icon-${tab}`);
        const label = document.getElementById(`${platform}-label-${tab}`);
        if (!icon || !label) return;

        if (tab === tabKey) {
          icon.style.color = '#2E1C59';
          label.style.color = '#2E1C59';
          label.classList.remove('font-medium');
          label.classList.add('font-bold');
        } else {
          icon.style.color = '#8E8E93';
          label.style.color = '#8E8E93';
          label.classList.remove('font-bold');
          label.classList.add('font-medium');
        }
      });

      if (tabKey === 'profile') {
        loadProfileFromBackend(platform);
      }

      renderScreen(platform, tabKey);
    }

    // ==============================================
    // 🚀 INITIALIZATION ON WINDOW LOAD
    // ==============================================
    window.addEventListener('load', () => {
      // 1. Initial render for both devices
      renderScreen('ios', 'home');
      renderScreen('android', 'home');

      // 2. Fetch live profile and user data from backend
      loadProfileFromBackend('ios');
      loadProfileFromBackend('android');

      // 3. Play launch splash sequence
      setTimeout(() => {
        replayAllSplash();
      }, 250);
    });
