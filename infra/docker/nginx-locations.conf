# Routes shared by the HTTP (nginx.conf) and HTTPS (nginx-https.conf) servers.

client_max_body_size 25M;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# WebSocket chat endpoint
location /api/v1/ws {
    proxy_pass http://backend_servers;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# REST API
location /api/v1/ {
    proxy_pass http://backend_servers;
}

# Next.js route handlers of the web app (OAuth callbacks)
location /api/ {
    proxy_pass http://web_servers;
}

location /health {
    proxy_pass http://backend_servers/health;
}

# Uploaded avatars and resumes
location /uploads/ {
    proxy_pass http://backend_servers;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    add_header X-Content-Type-Options "nosniff";
}

# Admin dashboard (built with ADMIN_BASE_PATH=/admin)
location /admin {
    proxy_pass http://admin_servers;
}

# Web app
location / {
    proxy_pass http://web_servers;
}
