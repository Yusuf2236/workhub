# Plain HTTP. Use it until a certificate is issued, then switch to nginx-https.conf
# (see docs/deploy.md). /.well-known/acme-challenge lets certbot prove domain ownership.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    upstream backend_servers { server backend:8080; }
    upstream web_servers     { server web:3000; }
    upstream admin_servers   { server admin:3001; }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/locations.conf;
    }
}
