# HTTPS with a Let's Encrypt certificate issued under the name "wzone"
# (certbot ... --cert-name wzone, see docs/deploy.md). HTTP redirects to HTTPS.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    upstream backend_servers { server backend:8080; }
    upstream web_servers     { server web:3000; }
    upstream admin_servers   { server admin:3001; }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/wzone/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wzone/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/locations.conf;
    }
}
