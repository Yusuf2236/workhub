apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workhub-ingress
  namespace: workhub
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "workhub-backend-service"
spec:
  rules:
    - host: api.workhub.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workhub-backend-service
                port:
                  number: 8080
