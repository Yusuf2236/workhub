apiVersion: apps/v1
kind: Deployment
metadata:
  name: workhub-backend
  namespace: workhub
  labels:
    app: workhub-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workhub-backend
  template:
    metadata:
      labels:
        app: workhub-backend
    spec:
      containers:
        - name: api
          image: workhub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: workhub-config
            - secretRef:
                name: workhub-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workhub-backend-service
  namespace: workhub
spec:
  type: ClusterIP
  selector:
    app: workhub-backend
  ports:
    - port: 8080
      targetPort: 8080
      name: http
