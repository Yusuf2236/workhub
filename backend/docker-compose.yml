services:
  postgres:
    image: postgres:16-alpine
    container_name: workhub_postgres
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - workhub_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: workhub_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: workhub_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - workhub_minio_data:/data

volumes:
  workhub_postgres_data:
  workhub_minio_data:
