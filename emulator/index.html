<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WZone — Mobil Emulator & Qurilmalar Sinovi (Android & iOS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070b14;
      overflow-x: hidden;
    }

    /* Device Frames */
    .device-wrapper {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top center;
    }

    /* iPhone 16 Pro (iOS) */
    .device-iphone16pro {
      width: 395px;
      height: 840px;
      border-radius: 52px;
      box-shadow: 0 0 0 11px #1e2024, 0 0 0 13px #383b42, 0 25px 65px -15px rgba(0,0,0,0.95);
      position: relative;
    }

    /* Google Pixel 8 Pro (Android) */
    .device-pixel8 {
      width: 400px;
      height: 840px;
      border-radius: 42px;
      box-shadow: 0 0 0 10px #1f2430, 0 0 0 12px #3e4656, 0 25px 65px -15px rgba(0,0,0,0.95);
      position: relative;
    }

    /* Dynamic Island (iOS) */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dynamic-island:hover {
      width: 220px;
      height: 42px;
      border-radius: 24px;
    }

    /* Punch Hole (Android) */
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      z-index: 50;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
    }

    /* iOS Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
    }

    /* Android Navigation Pill */
    .android-nav-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      z-index: 50;
      pointer-events: none;
    }

    .screen-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .screen-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .screen-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Device Iframe Container */
    .device-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #090e1a;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col bg-[#070b14]">

        <!-- Refresh Button -->
        <button onclick="refreshAllData()" title="Ikkala qurilmani yangilash" class="bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white px-3 py-2 rounded-xl border border-slate-700/80 text-xs font-bold flex items-center gap-1.5 transition active:scale-95 shadow-sm">

      </div>

      <!-- Health Badges -->
      <div class="flex items-center gap-2">
        <!-- Web Health -->
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-xl">

        </div>

    </div>
  </header>

  <!-- Main Dual Simulator Arena -->

          <div class="dynamic-island group" title="WZone Live Activity">
            <span class="text-[9px] font-mono text-white opacity-90 flex items-center gap-1.5 font-bold">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              WZone Live
            </span>
            <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
          </div>

          <!-- Screen Wrapper -->
          <div class="w-full h-full flex flex-col bg-[#080d1a] text-slate-100 overflow-hidden relative">
            
            <!-- iOS Status Bar -->
            <div class="h-11 px-7 pt-2 flex items-center justify-between text-xs font-semibold text-slate-200 z-40 bg-slate-900/75 backdrop-blur-md">
              <span id="iosClock" class="font-mono text-[11px] font-bold">15:20</span>
              <div class="flex items-center gap-2 text-[11px]">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>

              </div>
            </div>

            <!-- Device Content Viewport -->
            <div id="iosViewport" class="flex-1 flex flex-col overflow-hidden relative">
              <!-- Rendered via JS (Live Iframe OR Native UI) -->
            </div>

            <!-- iOS Home Indicator -->
            <div class="home-indicator"></div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal for Article / Vacancy Detail (Used in Native Mode) -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden animate-fadeIn">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl space-y-4">

      <div id="modalFooter" class="pt-3 border-t border-slate-800 flex justify-end gap-2"></div>

      { id: 'app-2', company: 'Payme', title: 'Mobile iOS / Android Lead', status: 'Ko‘rib chiqilmoqda', date: '27-sentyabr, 2026', badge: 'bg-amber-500/20 text-amber-300' }

      }

    // Real-time Dynamic Clocks for Devices
    function updateClocks() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${h}:${m}`;
      const elA = document.getElementById('androidClock');
      const elI = document.getElementById('iosClock');
      if (elA) elA.innerText = timeStr;
      if (elI) elI.innerText = timeStr;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // Health Checks
    async function checkHealth() {
      // Check Backend (:8080)
      try {
        const res = await fetch('http://localhost:8080/health');
        if (res.ok) {
          document.getElementById('backendDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
          document.getElementById('backendStatus').innerText = 'API :8080 ✓ OK';
        } else throw new Error();
      } catch (_) {
        document.getElementById('backendDot').className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
        document.getElementById('backendStatus').innerText = 'API :8080 (Demo)';
      }

      // Check Web (:3000)
      try {
        const res = await fetch('http://localhost:3000', { mode: 'no-cors' });
        document.getElementById('webDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
        document.getElementById('webStatus').innerText = 'Sayt :3000 ✓ OK';
      } catch (_) {
        document.getElementById('webDot').className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
        document.getElementById('webStatus').innerText = 'Sayt :3000 Offline';
      }
    }

    // Load Vacancies from Backend API
    async function loadVacancies() {
      try {
        const res = await fetch('http://localhost:8080/api/v1/vacancies?limit=30');
        const json = await res.json();
        if (json.data && json.data.vacancies && json.data.vacancies.length > 0) {
          vacancies = json.data.vacancies;
        } else if (json.data && json.data.items) {
          vacancies = json.data.items;
        } else {
          throw new Error('No items');
        }
      } catch (_) {
        // Fallback realistic dataset
        vacancies = [
          { id: 'v-1', title: 'Senior Go Backend Architect', company: 'Uzum Technologies', location: 'Tashkent shahri', salary_min: 3000, salary_max: 5500, salary_currency: 'USD', description: 'Yuqori yuklamali mikroxizmatlar, gRPC, PostgreSQL, Redis, Kafka va Kubernetes infratuzilmasi.' },
          { id: 'v-2', title: 'Mobile Android Lead (Kotlin Compose)', company: 'Click Uzbekistan', location: 'Tashkent shahri', salary_min: 2800, salary_max: 4500, salary_currency: 'USD', description: 'Clean Architecture, MVI/MVVM, Coroutines, Jetpack Compose, Material 3, Biometriya va xavfsizlik.' },
          { id: 'v-3', title: 'iOS Software Engineer (Swift / SwiftUI)', company: 'Payme Fintech', location: 'Tashkent shahri', salary_min: 2600, salary_max: 4200, salary_currency: 'USD', description: 'Fintech to‘lov tizimlari, SwiftUI, Combine, FaceID / Biometriya, Clean Swift.' },
          { id: 'v-4', title: 'Senior DevOps & Cloud Specialist', company: 'EPAM Systems', location: 'Masofaviy (Remote)', salary_min: 3500, salary_max: 5200, salary_currency: 'USD', description: 'CI/CD pipeline, Terraform, AWS/GCP, Docker, ArgoCD, Prometheus & Grafana monitoring.' },
          { id: 'v-5', title: 'Lead Product Designer (UI/UX)', company: 'Mohirdev Academy', location: 'Samarqand viloyati', salary_min: 1800, salary_max: 3000, salary_currency: 'USD', description: 'Mobil dizayn tizimlari, Figma, foydalanuvchi sinovlari, animatsiyalar va prototiplash.' }
        ];
      }
      renderBothScreens();
    }

    // Toggle App Engine (Live Web vs Native App)
    function setAppEngine(engine) {
      appEngine = engine;
      const btnLive = document.getElementById('btnModeLive');
      const btnNat = document.getElementById('btnModeNative');
      if (engine === 'live') {
        btnLive.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 bg-blue-600 text-white shadow-md shadow-blue-500/25';
        btnNat.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 text-slate-400 hover:text-white';
      } else {
        btnNat.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 bg-blue-600 text-white shadow-md shadow-blue-500/25';
        btnLive.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 text-slate-400 hover:text-white';
      }
      renderBothScreens();
    }

    // Render Both Screens
    function renderBothScreens() {
      const androidView = document.getElementById('androidViewport');
      const iosView = document.getElementById('iosViewport');

      if (appEngine === 'live') {
        // 🌐 100% SAYT BILAN JONLI VEB-ILOVA SINXRONIZATSIYASI
        const androidHtml = `
          <div class="w-full h-full flex flex-col bg-slate-950">
            <!-- URL status bar for Android -->
            <div class="px-4 py-1.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-emerald-400 text-[10px]"></i>
                <span class="font-mono text-white text-[10px]">wzone.uz</span>
              </div>
              <button onclick="refreshIframe('androidIframe')" class="hover:text-white"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <iframe id="androidIframe" src="http://localhost:3000" class="device-iframe flex-1" allow="geolocation; camera; microphone"></iframe>
          </div>
        `;

        const iosHtml = `
          <div class="w-full h-full flex flex-col bg-slate-950">
            <!-- URL status bar for iOS -->
            <div class="px-5 py-1.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-[11px] text-slate-400">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-shield text-blue-400 text-[10px]"></i>
                <span class="font-mono text-white text-[10px]">wzone.uz</span>
              </div>
              <button onclick="refreshIframe('iosIframe')" class="hover:text-white"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            </div>
            <iframe id="iosIframe" src="http://localhost:3000" class="device-iframe flex-1" allow="geolocation; camera; microphone"></iframe>
          </div>
        `;

        androidView.innerHTML = androidHtml;
        iosView.innerHTML = iosHtml;
      } else {
        // ⚡ NATIVE DUAL APP ENGINE (Material 3 & Cupertino)
        renderNativeAndroid(androidView);
        renderNativeIOS(iosView);
      }
    }

    function refreshIframe(id) {
      const el = document.getElementById(id);
      if (el) el.src = el.src;
    }

    // Set Active Tab (Native Mode)
    function setTab(tab) {
      currentTab = tab;
      renderBothScreens();
    }

    // 1. RENDER NATIVE ANDROID SCREEN (Material 3)
    function renderNativeAndroid(container) {
      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-y-auto screen-scroll pb-16 bg-[#0b101d]">
          ${buildCurrentTabBody('android')}
        </div>

          <div class="flex justify-between items-center">
            <span class="px-2.5 py-1 rounded-lg bg-blue-500/20 text-blue-400 font-bold text-xs">${vac.company || 'Kompaniya'}</span>
            <span class="text-emerald-400 font-black text-sm">${vac.salary_min ? `${vac.salary_min} - ${vac.salary_max} ${vac.salary_currency || 'USD'}` : 'Kelishilgan maosh'}</span>
          </div>
          <p class="text-slate-400 text-xs">📍 Hudud: ${vac.location || 'Toshkent shahri'}</p>
          <div class="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 text-xs space-y-1.5">
            <h4 class="font-bold text-white">Vakansiya tavsifi:</h4>
            <p class="text-slate-300 leading-relaxed">${vac.description || 'Kompaniyamiz jamoasiga tajribali mutaxassis taklif qilamiz.'}</p>
          </div>
        </div>
      `;
      document.getElementById('modalFooter').innerHTML = `
        <button onclick="closeModal()" class="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs">Yopish</button>
        <button onclick="applyToVacancy('${vac.id}', '${vac.title.replace(/'/g, "\\'")}', '${(vac.company || 'Kompaniya').replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs">Ariza topshirish</button>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function applyToVacancy(id, title, company) {
      applications.unshift({
        id: 'app-' + Date.now(),
        company: company,
        title: title,
        status: 'Yuborildi',
        date: 'Bugun',
        badge: 'bg-blue-500/20 text-blue-400'
      });
      closeModal();
      alert('✓ Arizangiz muvaffaqiyatli qabul qilindi!');
      setTab('applications');
    }

    function cancelApplication(id) {
      if (confirm('Arizani bekor qilmoqchimisiz?')) {
        applications = applications.filter(a => a.id !== id);
        renderBothScreens();
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInputBox');
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      chatMessages.push({
        id: 'm-' + Date.now(),
        sender_name: currentUser.name,
        content: text,
        is_me: true,
        time: 'Hozir'
      });
      input.value = '';
      renderBothScreens();

      // Auto Reply from Recruiter
      setTimeout(() => {
        chatMessages.push({
          id: 'm-' + (Date.now() + 1),
          sender_name: 'Uzum Technologies HR',
          content: 'Xabaringiz qabul qilindi. Tez orada rekruterimiz siz bilan bog‘lanadi.',
          is_me: false,
          time: 'Hozir'
        });
        renderBothScreens();
      }, 1000);
    }

    function addSkill() {
      const input = document.getElementById('newSkillInput');
      if (!input || !input.value.trim()) return;
      currentUser.skills.push(input.value.trim());
      renderBothScreens();
    }

    function removeSkill(idx) {
      currentUser.skills.splice(idx, 1);
      renderBothScreens();
    }

    function votePoll(idx) {
      if (pollVoted) return;
      pollOptions[idx].votes += 1;
      pollVoted = true;
      renderBothScreens();
    }

    function likeFeedPost(id) {
      const p = feedPosts.find(x => x.id === id);
      if (p) {
        p.liked = !p.liked;
        p.likes += p.liked ? 1 : -1;
        renderBothScreens();
      }
    }

    function changeScale(val) {
      document.getElementById('androidScale').style.transform = `scale(${val})`;
      document.getElementById('iosScale').style.transform = `scale(${val})`;
    }

    function changeMode(mode) {
      const android = document.getElementById('androidContainer');
      const ios = document.getElementById('iosContainer');
      if (mode === 'dual') {
        android.classList.remove('hidden');
        ios.classList.remove('hidden');
      } else if (mode === 'android') {
        android.classList.remove('hidden');
        ios.classList.add('hidden');
      } else if (mode === 'ios') {
        android.classList.add('hidden');
        ios.classList.remove('hidden');
      }
    }

    function refreshAllData() {
      checkHealth();
      loadVacancies();
    }

    // Init
    checkHealth();
    loadVacancies();
    setInterval(checkHealth, 5000);
  </script>
</body>
</html>
