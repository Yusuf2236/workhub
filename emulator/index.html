  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #070b14;
      overflow-x: hidden;
    }

    /* Device Frames */
    .device-wrapper {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top center;
    }

    /* iPhone 16 Pro (iOS) */
    .device-iphone16pro {
      width: 395px;
      height: 840px;
      border-radius: 52px;
      box-shadow: 0 0 0 11px #1e2024, 0 0 0 13px #383b42, 0 25px 65px -15px rgba(0,0,0,0.95);
      position: relative;
    }

    /* Google Pixel 8 Pro (Android) */
    .device-pixel8 {
      width: 400px;
      height: 840px;
      border-radius: 42px;
      box-shadow: 0 0 0 10px #1f2430, 0 0 0 12px #3e4656, 0 25px 65px -15px rgba(0,0,0,0.95);
      position: relative;
    }

    /* Dynamic Island (iOS) */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dynamic-island:hover {
      width: 220px;
      height: 42px;
      border-radius: 24px;
    }

    /* Punch Hole (Android) */
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      z-index: 50;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
    }

    /* iOS Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
    }

    /* Android Navigation Pill */
    .android-nav-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      z-index: 50;
      pointer-events: none;
    }

    .screen-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .screen-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .screen-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }

    /* Device Iframe Container */
    .device-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #090e1a;
    }
  </style>

          <div class="p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 text-xs space-y-1.5">
            <h4 class="font-bold text-white">${t.detailsTitle}:</h4>

      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function applyToVacancy(id, title, company) {
      const t = I18N[currentLang] || I18N.uz;
      applications.unshift({
        id: 'app-' + Date.now(),
        company: company,
        title: title,
        status: t.appStatusSubmitted,
        date: t.appAppliedDate,
        badge: 'bg-blue-500/20 text-blue-400'
      });
      closeModal();
      alert(t.applySuccess);
      setTab('applications');
    }

    function cancelApplication(id) {
      const t = I18N[currentLang] || I18N.uz;
      if (confirm(t.cancelConfirm)) {
        applications = applications.filter(a => a.id !== id);
        renderBothScreens();
      }
    }

    function sendChatMessage() {
      const t = I18N[currentLang] || I18N.uz;
      const input = document.getElementById('chatInputBox');
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      chatMessages.push({
        id: 'm-' + Date.now(),
        sender_name: currentUser.name,
        content: text,
        is_me: true,
        time: 'Hozir'
      });
      input.value = '';
      renderBothScreens();

      // Auto Reply from Recruiter
      setTimeout(() => {
        chatMessages.push({
          id: 'm-' + (Date.now() + 1),
          sender_name: 'Uzum Technologies HR',
          content: t.chatAutoReply,
          is_me: false,
          time: 'Hozir'
        });
        renderBothScreens();
      }, 1000);
    }

    function addSkill() {
      const input = document.getElementById('newSkillInput');
      if (!input || !input.value.trim()) return;
      currentUser.skills.push(input.value.trim());
      renderBothScreens();
    }

    function removeSkill(idx) {
      currentUser.skills.splice(idx, 1);
      renderBothScreens();
    }

    function votePoll(idx) {
      if (pollVoted) return;
      const list = POLL_DATA[currentLang] || POLL_DATA.uz;
      list[idx].votes += 1;
      pollVoted = true;
      renderBothScreens();
    }

    function likeFeedPost(id) {
      const posts = POSTS_DATA[currentLang] || POSTS_DATA.uz;
      const p = posts.find(x => x.id === id);
      if (p) {
        p.liked = !p.liked;
        p.likes += p.liked ? 1 : -1;
        renderBothScreens();
      }
    }

    function filterVacancies(query) {
      const q = (query || '').toLowerCase().trim();
      const container = document.getElementById('vacanciesListContainer');
      if (!container) return;
      const filtered = vacancies.filter(v => 
        (v.title && v.title.toLowerCase().includes(q)) ||
        (v.company && v.company.toLowerCase().includes(q)) ||
        (v.description && v.description.toLowerCase().includes(q))
      );
      const t = I18N[currentLang] || I18N.uz;
      container.innerHTML = filtered.map(v => `
        <div onclick="openVacancyModal('${v.id}')" class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-blue-500 cursor-pointer transition space-y-1.5 shadow-sm">

          <h4 class="text-xs font-bold text-white">${v.title}</h4>

            <span class="text-[11px] font-black text-emerald-400">${v.salary_min ? `${v.salary_min} - ${v.salary_max} ${v.salary_currency || 'USD'}` : t.salaryNegotiable}</span>
            <button class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold text-[10px]">${t.applyBtn}</button>
          </div>
        </div>
      `).join('');
    }

    function filterByRegion(region) {
      const container = document.getElementById('vacanciesListContainer');
      if (!container) return;
      let filtered = vacancies;
      if (region && region !== 'all') {
        filtered = vacancies.filter(v => v.location && v.location.toLowerCase().includes(region.toLowerCase()));
      }
      const t = I18N[currentLang] || I18N.uz;
      container.innerHTML = filtered.map(v => `
        <div onclick="openVacancyModal('${v.id}')" class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-blue-500 cursor-pointer transition space-y-1.5 shadow-sm">

      `).join('');

    function changeScale(val) {
      document.getElementById('androidScale').style.transform = `scale(${val})`;
      document.getElementById('iosScale').style.transform = `scale(${val})`;
    }

    function changeMode(mode) {
      const android = document.getElementById('androidContainer');
      const ios = document.getElementById('iosContainer');
      if (mode === 'dual') {
        android.classList.remove('hidden');
        ios.classList.remove('hidden');
      } else if (mode === 'android') {
        android.classList.remove('hidden');
        ios.classList.add('hidden');
      } else if (mode === 'ios') {
        android.classList.add('hidden');
        ios.classList.remove('hidden');
      }
    }

    function refreshAllData() {
      checkHealth();
      loadVacancies();
    }

    // Initialize with preferred language
    setLanguage(currentLang, false);
    checkHealth();
    loadVacancies();
    setInterval(checkHealth, 5000);
  </script>
</body>
