<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WZone — Mobil Emulator & Qurilmalar Sinovi (Android & iOS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b1120;
    }

    /* Device Frames */
    .device-wrapper {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* iPhone 16 Pro (iOS) */
    .device-iphone16pro {
      width: 395px;
      height: 840px;
      border-radius: 52px;
      box-shadow: 0 0 0 11px #262626, 0 0 0 13px #404040, 0 25px 60px -15px rgba(0,0,0,0.9);
      position: relative;
    }

    /* Google Pixel 8 Pro (Android) */
    .device-pixel8 {
      width: 400px;
      height: 840px;
      border-radius: 40px;
      box-shadow: 0 0 0 10px #27272a, 0 0 0 12px #52525b, 0 25px 60px -15px rgba(0,0,0,0.85);
      position: relative;
    }

    /* Dynamic Island (iOS) */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }

    /* Punch Hole (Android) */
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      background: #000;
      border-radius: 50%;
      z-index: 50;
    }

    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
    }

    /* Android Navigation Pill */
    .android-nav-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 4px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      z-index: 50;
      pointer-events: none;
    }

    .screen-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .screen-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .screen-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col bg-[#070b14]">

  <!-- Top Control Bar -->
  <header class="bg-[#0f172a] border-b border-slate-800 px-6 py-3 sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Brand & Status -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25">
          <i class="fa-solid fa-briefcase text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg text-white tracking-tight">WZone Mobile</h1>
            <span class="text-[10px] bg-blue-500/20 text-blue-400 font-black px-2.5 py-0.5 rounded-full border border-blue-500/30">
              EMULATOR v2026
            </span>
          </div>
          <p class="text-xs text-slate-400">Android (Kotlin) va iOS (Swift) Real-Vaqt Sinov Platformasi</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3">
        
        <!-- View Mode Selector -->
        <div>
          <label class="text-[11px] text-slate-400 font-bold block mb-0.5">Ko‘rish Rejimi</label>
          <select id="modeSelector" onchange="changeMode(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2 font-bold focus:ring-2 focus:ring-blue-500 cursor-pointer">
            <option value="dual" selected>⚡ YONMA-YON (Android + iOS ikkalasi bir vaqtda)</option>
            <option value="android">🤖 Faqat Android (Google Pixel 8 Pro)</option>
            <option value="ios">🍏 Faqat iOS (Apple iPhone 16 Pro)</option>
          </select>
        </div>

        <!-- Scale Selector -->
        <div>
          <label class="text-[11px] text-slate-400 font-bold block mb-0.5">Masshtab</label>
          <select id="scaleSelector" onchange="changeScale(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-2.5 py-2 font-bold cursor-pointer">
            <option value="0.75">75%</option>
            <option value="0.85" selected>85%</option>
            <option value="0.95">95%</option>
            <option value="1">100%</option>
          </select>
        </div>

        <!-- Demo Login Fast Button -->
        <div class="pt-4">
          <button onclick="quickDemoLogin()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-blue-500/25 transition">
            <i class="fa-solid fa-user-check"></i>
            <span>Tezkor Demo Kirish</span>
          </button>
        </div>

        <!-- Refresh Button -->
        <div class="pt-4">
          <button onclick="refreshAllData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-2 rounded-xl border border-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-rotate"></i>
            <span>Yangilash</span>
          </button>
        </div>

      </div>

      <!-- Backend Live Health Badge -->
      <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-2 rounded-xl">
        <span id="backendDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="backendStatus" class="text-xs text-slate-300 font-mono font-bold">Backend: :8080 ✓ OK</span>
      </div>

    </div>
  </header>

  <!-- Main Dual Simulator Arena -->
  <main class="flex-1 flex flex-wrap items-center justify-center gap-10 p-6 overflow-auto">
    
    <!-- 1. ANDROID DEVICE FRAME (Pixel 8 Pro) -->
    <div id="androidContainer" class="flex flex-col items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-xs font-black">
        <i class="fa-brands fa-android"></i>
        <span>ANDROID — Google Pixel 8 Pro (Kotlin + Compose)</span>
      </div>

      <div id="androidScale" class="device-wrapper">
        <div class="device-pixel8 bg-slate-950 overflow-hidden select-none border border-slate-700/60">
          
          <!-- Punch Hole Camera -->
          <div class="punch-hole"></div>

          <!-- Screen Wrapper -->
          <div class="w-full h-full flex flex-col bg-[#0b101d] text-slate-100 overflow-hidden relative">
            
            <!-- Android Status Bar -->
            <div class="h-10 px-6 pt-2 flex items-center justify-between text-xs font-semibold text-slate-300 z-40 bg-slate-900/60 backdrop-blur">
              <span id="androidClock" class="font-mono text-[11px] font-bold">15:05</span>
              <div class="flex items-center gap-2 text-[11px]">
                <span class="text-[10px] font-extrabold text-blue-400">5G</span>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
              </div>
            </div>

            <!-- Dynamic Viewport -->
            <div id="androidViewport" class="flex-1 flex flex-col overflow-y-auto screen-scroll pb-16">
              <!-- Content rendered via JavaScript -->
            </div>

            <!-- Android Bottom Nav Bar (Material 3) -->
            <div class="absolute bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex items-center justify-around py-2 z-40 text-xs">
              <button onclick="setTab('feed')" class="tab-btn flex flex-col items-center gap-1 text-blue-500 font-bold" data-tab="feed">
                <i class="fa-solid fa-house"></i>
                <span class="text-[10px]">Bosh sahifa</span>
              </button>
              <button onclick="setTab('vacancies')" class="tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="vacancies">
                <i class="fa-solid fa-briefcase"></i>
                <span class="text-[10px]">Vakansiyalar</span>
              </button>
              <button onclick="setTab('chat')" class="tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="chat">
                <i class="fa-solid fa-comment-dots"></i>
                <span class="text-[10px]">Chat</span>
              </button>
              <button onclick="setTab('applications')" class="tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="applications">
                <i class="fa-solid fa-file-circle-check"></i>
                <span class="text-[10px]">Arizalar</span>
              </button>
              <button onclick="setTab('profile')" class="tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="profile">
                <i class="fa-solid fa-user-gear"></i>
                <span class="text-[10px]">Profil</span>
              </button>
            </div>

            <!-- Android Nav Pill -->
            <div class="android-nav-bar"></div>

          </div>
        </div>
      </div>
    </div>

    <!-- 2. IOS DEVICE FRAME (iPhone 16 Pro) -->
    <div id="iosContainer" class="flex flex-col items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-blue-950/60 border border-blue-500/30 text-blue-400 text-xs font-black">
        <i class="fa-brands fa-apple"></i>
        <span>iOS — Apple iPhone 16 Pro (Swift + SwiftUI)</span>
      </div>

      <div id="iosScale" class="device-wrapper">
        <div class="device-iphone16pro bg-slate-950 overflow-hidden select-none border border-slate-700/60">
          
          <!-- Dynamic Island -->
          <div class="dynamic-island">
            <span class="text-[9px] font-mono text-white opacity-80 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
              WZone
            </span>
            <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700"></div>
          </div>

          <!-- Screen Wrapper -->
          <div class="w-full h-full flex flex-col bg-[#080d1a] text-slate-100 overflow-hidden relative">
            
            <!-- iOS Status Bar -->
            <div class="h-11 px-7 pt-2 flex items-center justify-between text-xs font-semibold text-slate-200 z-40 bg-slate-900/60 backdrop-blur">
              <span id="iosClock" class="font-mono text-[11px] font-bold">15:05</span>
              <div class="flex items-center gap-2 text-[11px]">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-emerald-400"></i>
              </div>
            </div>

            <!-- Dynamic Viewport -->
            <div id="iosViewport" class="flex-1 flex flex-col overflow-y-auto screen-scroll pb-16">
              <!-- Content rendered via JavaScript -->
            </div>

            <!-- iOS Bottom Tab Bar (SwiftUI) -->
            <div class="absolute bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur border-t border-slate-800/80 flex items-center justify-around py-2.5 z-40 text-xs">
              <button onclick="setTab('feed')" class="ios-tab-btn flex flex-col items-center gap-1 text-blue-500 font-bold" data-tab="feed">
                <i class="fa-solid fa-house"></i>
                <span class="text-[9px]">Bosh sahifa</span>
              </button>
              <button onclick="setTab('vacancies')" class="ios-tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="vacancies">
                <i class="fa-solid fa-briefcase"></i>
                <span class="text-[9px]">Vakansiyalar</span>
              </button>
              <button onclick="setTab('chat')" class="ios-tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="chat">
                <i class="fa-solid fa-message"></i>
                <span class="text-[9px]">Chat</span>
              </button>
              <button onclick="setTab('applications')" class="ios-tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="applications">
                <i class="fa-solid fa-file-lines"></i>
                <span class="text-[9px]">Arizalar</span>
              </button>
              <button onclick="setTab('profile')" class="ios-tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white" data-tab="profile">
                <i class="fa-solid fa-circle-user"></i>
                <span class="text-[9px]">Profil</span>
              </button>
            </div>

            <!-- iOS Home Indicator -->
            <div class="home-indicator"></div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal for Article / Vacancy Detail -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 id="modalTitle" class="text-base font-black text-white">Tafsilotlar</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm p-1">✕</button>
      </div>
      <div id="modalBody" class="text-xs text-slate-300 leading-relaxed space-y-3"></div>
      <div id="modalFooter" class="pt-3 border-t border-slate-800 flex justify-end gap-2"></div>
    </div>
  </div>

  <script>
    // State
    let currentTab = 'feed';
    let currentUser = {
      id: 'usr-demo-1',
      name: 'Farrux Zokirov',
      role: 'candidate',
      email: 'farrux@wzone.uz',
      skills: ['Go', 'Kotlin', 'Swift', 'PostgreSQL', 'Docker', 'REST API']
    };

    let vacancies = [];
    let chatMessages = [
      { id: '1', sender_name: 'HR Nilufar', content: 'Assalomu alaykum! Rezyumengizni ko‘rib chiqdik. Suhbatga tayyormisiz?', is_me: false, time: '10:30' },
      { id: '2', sender_name: 'Farrux Zokirov', content: 'Va alaykum assalom! Ha, albatta. Ertaga soat 15:00 da qulay.', is_me: true, time: '10:32' }
    ];
    let applications = [
      { id: 'app-1', company: 'Uzum Technologies', title: 'Senior Go Backend Architect', status: 'Ko‘rib chiqilmoqda', date: '28-sentyabr, 2026' }
    ];

    let newsArticles = [
      {
        id: 'news-1',
        title: "O'zbekistonda 2026-yilda eng yuqori maosh to'lanadigan IT va Fintech yo'nalishlari",
        excerpt: "Go backend, AI integratsiyalari va kiberxavfsizlik mutaxassislariga bo'lgan talab 45% ga oshdi. O'rtacha oylik maoshlar $1,500 dan $4,000 gacha.",
        content: "O'zbekiston raqamli iqtisodiyoti tez sur'atlar bilan rivojlanmoqda. 2026-yilda Fintech, bank tizimlari va xalqaro autsorsing bozorida yuqori malakali mutaxassislarga bo'lgan ehtiyoj rekord darajaga yetdi.",
        category: "Bozor tahlili",
        image: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=800&q=80",
        author: "Sanjar Rahimov",
        date: "28-sentyabr, 2026",
        likes: 89
      },
      {
        id: 'news-2',
        title: "Toshkentda 'Tech Careers Summit 2026' yirik xalqaro ish yarmarkasi start oldi",
        excerpt: "50 dan ortiq yirik texnologik kompaniyalar 1,000 dan ziyod ochiq bo'sh ish o'rinlarini taqdim etmoqda.",
        content: "Poytaxtimizda yilning eng yirik karyera forumi o'z ishini boshladi. Forumda Uzum, EPAM, Payme, Click va boshqa yetakchi kompaniyalar qatnashmoqda.",
        category: "Tadbirlar",
        image: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=800&q=80",
        author: "Aziza Yo‘ldosheva",
        date: "27-sentyabr, 2026",
        likes: 142
      }
    ];

    let comments = [
      { id: 'c-1', name: 'Jasur Alimov', role: 'Lead Designer', text: "WZone mobil ilovasi juda qulay va tez ishlayapti. Ayniqsa chat va viloyatlar bo'yicha qidiruv zo'r!", time: '15 daqiqa oldin', likes: 24, topic: '#platforma' },
      { id: 'c-2', name: 'Nilufar Qosimova', role: 'HR Director', text: "Bizning kompaniyada hozirda 12 ta ochiq vakansiya bor. Rezyumelarni WZone orqali ko'rib chiqyapmiz!", time: '40 daqiqa oldin', likes: 38, topic: '#vakansiyalar' }
    ];

    // Backend Ping
    async function checkBackend() {
      try {
        const res = await fetch('http://localhost:8080/health');
        if (res.ok) {
          document.getElementById('backendDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
          document.getElementById('backendStatus').innerText = 'Backend: :8080 ✓ ONLINE';
        } else {
          throw new Error();
        }
      } catch (_) {
        document.getElementById('backendDot').className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
        document.getElementById('backendStatus').innerText = 'Backend: Offline (Demo rejim)';
      }
    }

    async function loadVacancies() {
      try {
        const res = await fetch('http://localhost:8080/api/v1/vacancies?limit=20');
        const json = await res.json();
        if (json.data && json.data.items) {
          vacancies = json.data.items;
        }
      } catch (_) {
        // Fallback default sample vacancies
        vacancies = [
          { id: 'v1', title: 'Senior Go Backend Architect', company: 'Uzum Technologies', location: 'Tashkent shahri', salary_min: 3000, salary_max: 5500, salary_currency: 'USD', description: 'Microservices, gRPC, high-load architecture.' },
          { id: 'v2', title: 'Mobile iOS Engineer (SwiftUI)', company: 'Payme', location: 'Tashkent shahri', salary_min: 2500, salary_max: 4200, salary_currency: 'USD', description: 'Fintech mobile solutions, clean architecture.' },
          { id: 'v3', title: 'Cloud DevOps Specialist', company: 'EPAM Systems', location: 'Masofaviy (Remote)', salary_min: 3200, salary_max: 5000, salary_currency: 'USD', description: 'Kubernetes, Terraform, AWS/GCP pipelines.' },
          { id: 'v4', title: 'Lead Product Designer (UI/UX)', company: 'Mohirdev', location: 'Samarqand viloyati', salary_min: 1800, salary_max: 3000, salary_currency: 'USD', description: 'Design systems, mobile user journeys.' }
        ];
      }
      renderBothScreens();
    }

    // Set Active Tab
    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.className = active ? 'tab-btn flex flex-col items-center gap-1 text-blue-500 font-bold' : 'tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white';
      });
      document.querySelectorAll('.ios-tab-btn').forEach(btn => {
        const active = btn.dataset.tab === tab;
        btn.className = active ? 'ios-tab-btn flex flex-col items-center gap-1 text-blue-500 font-bold' : 'ios-tab-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white';
      });
      renderBothScreens();
    }

    // Render Tab Views
    function renderBothScreens() {
      const androidView = document.getElementById('androidViewport');
      const iosView = document.getElementById('iosViewport');
      const content = buildTabContent();
      androidView.innerHTML = content;
      iosView.innerHTML = content;
    }

    function buildTabContent() {
      switch(currentTab) {
        case 'feed':
          return buildFeedTab();
        case 'vacancies':
          return buildVacanciesTab();
        case 'chat':
          return buildChatTab();
        case 'applications':
          return buildApplicationsTab();
        case 'profile':
          return buildProfileTab();
        default:
          return buildFeedTab();
      }
    }

    // 1. HOME FEED TAB
    function buildFeedTab() {
      return `
        <div class="p-4 space-y-4">
          <!-- Hero Banner -->
          <div class="rounded-2xl p-4 bg-gradient-to-br from-blue-700 via-indigo-700 to-slate-900 text-white shadow-lg space-y-2.5">
            <span class="text-[9px] font-black uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">✨ WZone 2026 Mobil</span>
            <h2 class="text-base font-black leading-tight">Karyerangizni yangi bosqichga olib chiqing</h2>
            <p class="text-[11px] text-blue-100 leading-snug">Vakansiyalar, soha yangiliklari, maoshlar indeksi va jonli muloqot.</p>
            <div class="pt-1 flex gap-2">
              <button onclick="setTab('vacancies')" class="px-3 py-1.5 rounded-xl bg-white text-blue-700 font-black text-[11px]">Vakansiyalar →</button>
            </div>
          </div>

          <!-- Sanoat Yangiliklari & Tahlillar -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-black uppercase tracking-wider text-slate-200">Yangiliklar & Tahlillar</h3>
              <span class="text-[9px] font-bold text-blue-400">REAL-TIME</span>
            </div>
            ${newsArticles.map(art => `
              <div onclick="openArticleModal('${art.id}')" class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-blue-500 cursor-pointer transition space-y-2 shadow-sm">
                <img src="${art.image}" class="w-full h-28 object-cover rounded-xl" />
                <div class="flex items-center justify-between text-[10px] text-slate-400">
                  <span class="font-bold text-blue-400">${art.category}</span>
                  <span>${art.date}</span>
                </div>
                <h4 class="text-xs font-bold text-white leading-snug">${art.title}</h4>
                <p class="text-[11px] text-slate-300 line-clamp-2">${art.excerpt}</p>
                <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1">
                  <span>Muallif: ${art.author}</span>
                  <span class="text-blue-400 font-bold">To‘liq o‘qish →</span>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Jonli Kommentariyalar & Muhokamalar -->
          <div class="space-y-2.5">
            <h3 class="text-xs font-black uppercase tracking-wider text-slate-200">Jonli Muhokamalar & Izohlar</h3>
            <div class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-2">
              <input id="commentBoxInput" type="text" placeholder="Fikringiz yoki maslahatingizni yozing..." class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white placeholder-slate-400 outline-none" />
              <div class="flex justify-between items-center">
                <span class="text-[10px] text-blue-400 font-bold">#fikr</span>
                <button onclick="submitComment()" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold">Yuborish</button>
              </div>
            </div>
            ${comments.map(c => `
              <div class="p-3 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-1.5 text-xs">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-white text-[11px]">${c.name} <span class="text-[9px] text-slate-400">(${c.role})</span></span>
                  <span class="text-[9px] text-blue-400 font-bold">${c.topic}</span>
                </div>
                <p class="text-[11px] text-slate-300 leading-snug">${c.text}</p>
                <div class="flex justify-between text-[10px] text-slate-400 pt-1">
                  <span>${c.time}</span>
                  <span class="cursor-pointer text-rose-400 font-bold" onclick="likeComment('${c.id}')">❤️ ${c.likes}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Sara Vakansiyalar Preview -->
          <div class="space-y-2.5">
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-black uppercase tracking-wider text-slate-200">Haftaning Sara Vakansiyalari</h3>
              <span onclick="setTab('vacancies')" class="text-[10px] text-blue-400 font-bold cursor-pointer">Barchasi →</span>
            </div>
            ${vacancies.slice(0, 3).map(v => `
              <div onclick="openVacancyModal('${v.id}')" class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-blue-500 cursor-pointer transition space-y-1">
                <div class="flex justify-between text-[10px]">
                  <span class="font-bold text-blue-400">${v.company || 'Kompaniya'}</span>
                  <span class="text-slate-400">${v.location || 'Toshkent'}</span>
                </div>
                <h4 class="text-xs font-bold text-white">${v.title}</h4>
                <div class="text-[11px] font-black text-emerald-400">
                  ${v.salary_min ? `${v.salary_min} - ${v.salary_max} ${v.salary_currency || 'USD'}` : 'Kelishilgan maosh'}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Maoshlar Indeksi -->
          <div class="p-3.5 rounded-2xl bg-gradient-to-br from-slate-900 to-black border border-slate-800 space-y-2">
            <h3 class="text-xs font-black text-white">📈 2026-yil IT Maoshlar Indeksi</h3>
            <div class="space-y-1.5 text-[10px]">
              <div class="flex justify-between text-slate-300"><span>Backend (Go, Java)</span><span class="font-bold text-cyan-400">$900 - $3,800</span></div>
              <div class="flex justify-between text-slate-300"><span>Mobile (Kotlin, Swift)</span><span class="font-bold text-cyan-400">$800 - $3,200</span></div>
              <div class="flex justify-between text-slate-300"><span>DevOps & Kiberxavfsizlik</span><span class="font-bold text-cyan-400">$1,200 - $4,200</span></div>
            </div>
          </div>
        </div>
      `;
    }

    // 2. VACANCIES CATALOG TAB
    function buildVacanciesTab() {
      return `
        <div class="p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-black text-white">Vakansiyalar Katalogi</h2>
            <span class="text-[10px] font-bold text-blue-400">${vacancies.length} ta vakansiya</span>
          </div>

          <!-- Search Input -->
          <input id="vacSearchInput" onkeyup="filterVacancies(this.value)" type="text" placeholder="Kasb yoki kompaniya bo‘yicha qidiring..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-400 outline-none" />

          <!-- Region Filter -->
          <div class="flex items-center gap-2 text-xs">
            <span class="text-slate-400 text-[10px]">Hudud:</span>
            <select onchange="filterByRegion(this.value)" class="bg-slate-900 border border-slate-800 text-white text-[11px] rounded-lg px-2 py-1 font-bold">
              <option value="all">Barcha hududlar</option>
              <option value="Tashkent">Toshkent shahri</option>
              <option value="Samarqand">Samarqand viloyati</option>
              <option value="Fargona">Farg‘ona viloyati</option>
              <option value="Remote">Masofaviy (Remote)</option>
            </select>
          </div>

          <!-- Cards List -->
          <div id="vacanciesListContainer" class="space-y-2.5 pt-1">
            ${vacancies.map(v => `
              <div onclick="openVacancyModal('${v.id}')" class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-blue-500 cursor-pointer transition space-y-1.5">
                <div class="flex justify-between text-[10px]">
                  <span class="font-bold text-blue-400">${v.company || 'Kompaniya'}</span>
                  <span class="text-slate-400">📍 ${v.location || 'Toshkent'}</span>
                </div>
                <h4 class="text-xs font-bold text-white">${v.title}</h4>
                <p class="text-[10px] text-slate-400 line-clamp-2">${v.description || 'Kompaniyada ochiq vakansiya.'}</p>
                <div class="flex justify-between items-center pt-1">
                  <span class="text-[11px] font-black text-emerald-400">${v.salary_min ? `${v.salary_min} - ${v.salary_max} ${v.salary_currency || 'USD'}` : 'Kelishilgan'}</span>
                  <button class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold text-[10px]">Batafsil</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 3. CHAT TAB
    function buildChatTab() {
      return `
        <div class="p-4 h-full flex flex-col justify-between space-y-3">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <div>
              <h3 class="text-xs font-black text-white">WZone Jonli Muloqot</h3>
              <p class="text-[10px] text-emerald-400 font-bold">● Online • Umumiy xona</p>
            </div>
            <button onclick="refreshChat()" class="text-[10px] text-blue-400">Yangilash</button>
          </div>

          <div id="chatMessagesContainer" class="flex-1 space-y-2.5 overflow-y-auto screen-scroll pr-1 max-h-[460px]">
            ${chatMessages.map(m => `
              <div class="flex ${m.is_me ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[80%] rounded-2xl p-2.5 ${m.is_me ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'} space-y-0.5">
                  ${!m.is_me ? `<span class="text-[9px] font-bold text-blue-400 block">${m.sender_name}</span>` : ''}
                  <p class="text-xs leading-snug">${m.content}</p>
                  <span class="text-[8px] text-right block opacity-70">${m.time || 'Hozir'}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Input bar -->
          <div class="pt-2 border-t border-slate-800 flex gap-2">
            <input id="chatInputBox" onkeydown="if(event.key==='Enter') sendChatMessage()" type="text" placeholder="Xabaringizni yozing..." class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-400 outline-none" />
            <button onclick="sendChatMessage()" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">Yuborish</button>
          </div>
        </div>
      `;
    }

    // 4. APPLICATIONS TAB
    function buildApplicationsTab() {
      return `
        <div class="p-4 space-y-3">
          <h2 class="text-sm font-black text-white">Mening Arizalarim</h2>
          <div class="space-y-2.5">
            ${applications.map(app => `
              <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-1.5">
                <div class="flex justify-between items-center text-[10px]">
                  <span class="font-bold text-blue-400">${app.company}</span>
                  <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-bold">${app.status}</span>
                </div>
                <h4 class="text-xs font-bold text-white">${app.title}</h4>
                <p class="text-[9px] text-slate-400">Sana: ${app.date}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 5. PROFILE TAB (1st: Resumes & Skills, 2nd: Settings)
    function buildProfileTab() {
      return `
        <div class="p-4 space-y-4">
          <!-- Profile Badge -->
          <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-black text-white text-base">FZ</div>
            <div>
              <h3 class="text-xs font-bold text-white">${currentUser.name}</h3>
              <p class="text-[10px] text-slate-400">${currentUser.email}</p>
              <span class="text-[9px] text-blue-400 font-bold">Senior Go & Mobile Engineer</span>
            </div>
          </div>

          <!-- 1-O'RIN: REZYUMELAR VA KO'NIKMALAR (SKILLS) -->
          <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-2.5">
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-black text-blue-400">1. Rezyumelar & Skillar</h3>
              <span class="text-[9px] font-black text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-500/30">AI Match: 88%</span>
            </div>

            <p class="text-[10px] text-slate-400 font-semibold">Mening Ko‘nikmalarim (Skills):</p>
            <div class="flex flex-wrap gap-1.5" id="profileSkillsContainer">
              ${currentUser.skills.map(s => `
                <span class="text-[10px] font-bold px-2 py-1 rounded-lg bg-blue-600/20 text-blue-300 border border-blue-500/30">${s} ✕</span>
              `).join('')}
            </div>

            <div class="flex gap-1.5 pt-1">
              <input id="newSkillInput" type="text" placeholder="Yangi ko‘nikma..." class="flex-1 px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white outline-none" />
              <button onclick="addSkill()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs">+</button>
            </div>
          </div>

          <!-- 2-O'RIN: SAYT VA PROFIL SOZLAMALARI -->
          <div class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-3">
            <h3 class="text-xs font-black text-blue-400">2. Ilova va Tizim Sozlamalari</h3>
            
            <div class="flex justify-between items-center text-xs">
              <div>
                <span class="font-bold text-white text-[11px] block">Ilova tili</span>
                <span class="text-[9px] text-slate-400">O‘zbekcha, Ruscha, Inglizcha</span>
              </div>
              <span class="text-[11px] font-bold text-blue-400">O‘zbekcha (UZ)</span>
            </div>

            <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-800">
              <span class="font-bold text-white text-[11px]">Tungi rejim (Dark theme)</span>
              <span class="text-emerald-400 font-bold text-[10px]">Yoqilgan</span>
            </div>

            <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-800">
              <span class="font-bold text-white text-[11px]">Bildirishnomalar</span>
              <span class="text-emerald-400 font-bold text-[10px]">Faol</span>
            </div>

            <button onclick="quickDemoLogin()" class="w-full py-2 rounded-xl bg-rose-600/20 text-rose-400 font-bold text-xs mt-2 border border-rose-500/30">Chiqish (Logout)</button>
          </div>
        </div>
      `;
    }

    // Modal Actions
    function openArticleModal(id) {
      const art = newsArticles.find(a => a.id === id);
      if (!art) return;
      document.getElementById('modalTitle').innerText = art.title;
      document.getElementById('modalBody').innerHTML = `
        <img src="${art.image}" class="w-full h-44 object-cover rounded-xl" />
        <div class="flex justify-between text-slate-400 text-[10px]">
          <span>Muallif: ${art.author}</span>
          <span>${art.date}</span>
        </div>
        <p class="text-slate-200 text-xs leading-relaxed whitespace-pre-line">${art.content}</p>
      `;
      document.getElementById('modalFooter').innerHTML = `
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs">Yopish</button>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function openVacancyModal(id) {
      const vac = vacancies.find(v => v.id === id);
      if (!vac) return;
      document.getElementById('modalTitle').innerText = vac.title;
      document.getElementById('modalBody').innerHTML = `
        <div class="space-y-2">
          <span class="px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold text-[10px]">${vac.company || 'Kompaniya'}</span>
          <p class="text-emerald-400 font-black text-sm">${vac.salary_min ? `${vac.salary_min} - ${vac.salary_max} ${vac.salary_currency || 'USD'}` : 'Kelishilgan maosh'}</p>
          <p class="text-slate-400 text-xs">📍 Hudud: ${vac.location || 'Toshkent'}</p>
          <div class="pt-2 border-t border-slate-800">
            <h4 class="font-bold text-white text-xs mb-1">Vakansiya haqida:</h4>
            <p class="text-slate-300 text-xs">${vac.description || 'Kompaniya jamoasiga tajribali mutaxassis qidirilmoqda.'}</p>
          </div>
        </div>
      `;
      document.getElementById('modalFooter').innerHTML = `
        <button onclick="closeModal()" class="px-3 py-2 rounded-xl bg-slate-800 text-white font-bold text-xs">Yopish</button>
        <button onclick="applyToVacancy('${vac.id}', '${vac.title}', '${vac.company}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs">Ariza topshirish</button>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function applyToVacancy(id, title, company) {
      applications.unshift({
        id: 'app-' + Date.now(),
        company: company,
        title: title,
        status: 'Yuborildi',
        date: 'Bugun'
      });
      closeModal();
      alert('✓ Arizangiz muvaffaqiyatli topshirildi!');
      setTab('applications');
    }

    function submitComment() {
      const input = document.getElementById('commentBoxInput');
      if (!input || !input.value.trim()) return;
      comments.unshift({
        id: 'c-' + Date.now(),
        name: currentUser.name,
        role: 'Nomzod',
        text: input.value.trim(),
        time: 'Hozirgina',
        likes: 1,
        topic: '#fikr'
      });
      renderBothScreens();
    }

    function likeComment(id) {
      const c = comments.find(x => x.id === id);
      if (c) {
        c.likes += 1;
        renderBothScreens();
      }
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInputBox');
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      chatMessages.push({
        id: 'm-' + Date.now(),
        sender_name: currentUser.name,
        content: text,
        is_me: true,
        time: 'Hozir'
      });
      input.value = '';
      renderBothScreens();
      // Auto reply simulation
      setTimeout(() => {
        chatMessages.push({
          id: 'm-' + (Date.now() + 1),
          sender_name: 'HR Menejer',
          content: 'Xabaringiz qabul qilindi. Tez orada rekruterimiz siz bilan bog‘lanadi.',
          is_me: false,
          time: 'Hozir'
        });
        renderBothScreens();
      }, 1200);
    }

    function addSkill() {
      const input = document.getElementById('newSkillInput');
      if (!input || !input.value.trim()) return;
      currentUser.skills.push(input.value.trim());
      renderBothScreens();
    }

    function changeScale(val) {
      document.getElementById('androidScale').style.transform = `scale(${val})`;
      document.getElementById('iosScale').style.transform = `scale(${val})`;
    }

    function changeMode(mode) {
      const android = document.getElementById('androidContainer');
      const ios = document.getElementById('iosContainer');
      if (mode === 'dual') {
        android.classList.remove('hidden');
        ios.classList.remove('hidden');
      } else if (mode === 'android') {
        android.classList.remove('hidden');
        ios.classList.add('hidden');
      } else if (mode === 'ios') {
        android.classList.add('hidden');
        ios.classList.remove('hidden');
      }
    }

    function quickDemoLogin() {
      currentUser.name = "Farrux Zokirov (Kirilgan)";
      renderBothScreens();
      alert("✓ Tizimga muvaffaqiyatli kirildi!");
    }

    function refreshAllData() {
      checkBackend();
      loadVacancies();
    }

    // Init
    checkBackend();
    loadVacancies();
    setInterval(checkBackend, 10000);
  </script>
</body>
</html>
