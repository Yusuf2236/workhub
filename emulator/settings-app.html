<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkHub — Settings App Independent Runner (Android & iOS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 10%, #151828 0%, #080910 70%, #040508 100%);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Device Frames */
    .device-shadow-ios {
      box-shadow: 0 30px 80px -15px rgba(0,0,0,0.9), 0 0 0 12px #22242a, 0 0 0 14px #3a3d46;
    }

    .device-shadow-android {
      box-shadow: 0 30px 80px -15px rgba(0,0,0,0.9), 0 0 0 11px #1d212a, 0 0 0 13px #353b47;
    }

    /* Custom Scrollbar for Phone Screens */
    .screen-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .screen-scroll::-webkit-scrollbar-thumb {
      background: rgba(140, 140, 160, 0.25);
      border-radius: 9999px;
    }

    /* Modal Sheet Slide Up */
    .sheet-enter {
      transform: translateY(0%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-exit {
      transform: translateY(105%);
      transition: transform 0.24s cubic-bezier(0.4, 0, 1, 1);
    }

    /* Fluid Theme Mode Animated Transition */
    .theme-transition-active,
    .theme-transition-active * {
      transition: background-color 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.45s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Expanding Circular Ripple Bloom from Switch */
    .theme-ripple-bloom {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 55;
      animation: rippleExpand 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes rippleExpand {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.95;
      }
      65% {
        opacity: 0.85;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0;
      }
    }

    /* Spring Icon 360 Spin & Scale Morph */
    .icon-spin-spring {
      animation: iconSpin 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      display: inline-block;
    }

    @keyframes iconSpin {
      0% {
        transform: rotate(0deg) scale(0.4);
        opacity: 0;
      }
      65% {
        transform: rotate(380deg) scale(1.3);
        opacity: 1;
      }
      100% {
        transform: rotate(360deg) scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="p-4 sm:p-8">

  <!-- Top Navigation & Control Bar -->
  <header class="max-w-7xl mx-auto mb-8 flex flex-wrap items-center justify-between gap-4 border-b border-slate-800/80 pb-5">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-purple-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-sliders"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
          WorkHub Settings App
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold uppercase tracking-wider">Mustaqil Rejim (Independent)</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-400">
          Android va iOS <span class="text-emerald-400 font-semibold">100% alohida</span> holatda ishlaydi (bir-biriga ta'sir qilmaydi)
        </p>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="flex items-center gap-3">
      <button onclick="resetDevice('android')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-800/50 transition active:scale-95 flex items-center gap-1.5">
        <i class="fa-brands fa-android"></i> Reset Pixel
      </button>
      <button onclick="resetDevice('ios')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition active:scale-95 flex items-center gap-1.5">
        <i class="fa-brands fa-apple"></i> Reset iPhone
      </button>
      <div class="h-6 w-px bg-slate-800"></div>
      <span class="text-xs text-slate-400 font-mono">Port: 3005</span>
    </div>
  </header>

  <!-- Device Dual Runner Container -->
  <main class="max-w-7xl mx-auto flex flex-col xl:flex-row items-center justify-center gap-10 xl:gap-14 pb-16">

    <!-- ==================== ANDROID DEVICE (Pixel 8 Pro) ==================== -->
    <div class="flex flex-col items-center">
      <div class="flex items-center justify-between w-[390px] mb-3 px-3 py-1 rounded-full bg-slate-900/90 border border-slate-800 text-xs font-bold text-slate-300">
        <div class="flex items-center gap-2">
          <i class="fa-brands fa-android text-emerald-400 text-sm"></i>
          <span>Google Pixel 8 Pro · Compose</span>
        </div>
        <button onclick="resetDevice('android')" class="text-[10px] text-slate-400 hover:text-emerald-400">Reset</button>
      </div>

      <div class="w-[390px] h-[810px] rounded-[44px] device-shadow-android bg-[#0d0f17] relative overflow-hidden flex flex-col select-none border border-slate-700/50">
        <!-- Punch Hole Camera -->
        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-black z-50 ring-2 ring-white/10"></div>

        <!-- Android Status Bar -->
        <div class="h-10 pt-2 px-7 flex items-center justify-between text-xs font-semibold text-slate-400 z-40 shrink-0">
          <span id="androidClock">16:30</span>
          <div class="flex items-center gap-2 text-[11px]">
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-battery-full text-emerald-400"></i>
          </div>
        </div>

        <!-- Android App Content Screen -->
        <div id="androidScreen" class="flex-1 overflow-y-auto screen-scroll relative flex flex-col transition-colors duration-200">
          <!-- Injected by JS for Android only -->
        </div>

        <!-- Android Nav Bar Pill -->
        <div class="h-5 flex items-center justify-center pb-1 shrink-0 z-40">
          <div class="w-24 h-1 rounded-full bg-slate-500/40"></div>
        </div>
      </div>
    </div>

    <!-- ==================== iOS DEVICE (iPhone 16 Pro) ==================== -->
    <div class="flex flex-col items-center">
      <div class="flex items-center justify-between w-[390px] mb-3 px-3 py-1 rounded-full bg-slate-900/90 border border-slate-800 text-xs font-bold text-slate-300">
        <div class="flex items-center gap-2">
          <i class="fa-brands fa-apple text-slate-200 text-sm"></i>
          <span>Apple iPhone 16 Pro · SwiftUI</span>
        </div>
        <button onclick="resetDevice('ios')" class="text-[10px] text-slate-400 hover:text-indigo-400">Reset</button>
      </div>

      <div class="w-[390px] h-[810px] rounded-[52px] device-shadow-ios bg-[#000000] relative overflow-hidden flex flex-col select-none border border-slate-700/50">
        <!-- Dynamic Island -->
        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 rounded-full bg-black z-50 flex items-center justify-between px-2.5 border border-white/5 cursor-pointer hover:w-36 transition-all duration-300">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-500/80"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
        </div>

        <!-- iOS Status Bar -->
        <div class="h-11 pt-2 px-8 flex items-center justify-between text-xs font-semibold text-slate-300 z-40 shrink-0">
          <span id="iosClock">16:30</span>
          <div class="flex items-center gap-2 text-[11px]">
            <i class="fa-solid fa-signal"></i>
            <span class="text-[10px] font-bold">5G</span>
            <i class="fa-solid fa-battery-three-quarters text-slate-200"></i>
          </div>
        </div>

        <!-- iOS App Content Screen -->
        <div id="iosScreen" class="flex-1 overflow-y-auto screen-scroll relative flex flex-col transition-colors duration-200">
          <!-- Injected by JS for iOS only -->
        </div>

        <!-- iOS Home Indicator -->
        <div class="h-6 flex items-center justify-center pb-2 shrink-0 z-40">
          <div class="w-32 h-1 rounded-full bg-white/40"></div>
        </div>
      </div>
    </div>

  </main>

  <script>
    const COLORS = [
      { hex: '#7C5CFF', name: 'Violet' },
      { hex: '#FF4D8D', name: 'Rose' },
      { hex: '#3B82F6', name: 'Blue' },
      { hex: '#22C55E', name: 'Green' },
      { hex: '#F59E0B', name: 'Amber' }
    ];

    const LANGUAGES = [
      { code: 'en', name: 'English' },
      { code: 'uz', name: 'O‘zbekcha' },
      { code: 'ru', name: 'Русский' },
      { code: 'fr', name: 'Français' },
      { code: 'es', name: 'Español' },
      { code: 'de', name: 'Deutsch' },
      { code: 'pt', name: 'Português' },
      { code: 'it', name: 'Italiano' }
    ];

    function getColorName(hex) {
      const found = COLORS.find(c => c.hex.toLowerCase() === hex.toLowerCase());
      return found ? found.name : 'Custom';
    }

    function getTextScaleName(scale) {
      if (scale <= 0.9) return 'Small';
      if (scale <= 1.0) return 'Default';
      if (scale <= 1.15) return 'Large';
      return 'X-Large';
    }

    function getRadiusStyleName(r) {
      if (r >= 20) return 'Rounded';
      if (r >= 12) return 'Soft';
      return 'Crisp';
    }

    function getLanguageName(code) {
      const found = LANGUAGES.find(l => l.code === code);
      return found ? found.name : code.toUpperCase();
    }

    // Factory for completely standalone device state
    function createDeviceState(platform) {
      const isAndroid = platform === 'android';
      const defaults = {
        dark: isAndroid, // Android starts dark, iOS starts light
        accent: isAndroid ? '#7C5CFF' : '#FF4D8D', // Android Violet, iOS Rose
        textScale: 1.0,
        radius: isAndroid ? 22 : 14,
        lang: isAndroid ? 'uz' : 'en',
        push: true,
        messages: true,
        promos: false,
        sound: true,
        vibration: true,

        // Pending (staged)
        pendingDark: isAndroid,
        pendingAccent: isAndroid ? '#7C5CFF' : '#FF4D8D',
        pendingTextScale: 1.0,
        pendingRadius: isAndroid ? 22 : 14,
        pendingLang: isAndroid ? 'uz' : 'en',
        pendingPush: true,
        pendingMessages: true,
        pendingPromos: false,
        pendingSound: true,
        pendingVibration: true,

        currentRoute: 'settings',
        showReview: false,
        isAnimating: false
      };

      try {
        const saved = localStorage.getItem('workhub_app_state_' + platform);
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(defaults, parsed);
          // Sync pending with saved values
          defaults.pendingDark = defaults.dark;
          defaults.pendingAccent = defaults.accent;
          defaults.pendingTextScale = defaults.textScale;
          defaults.pendingRadius = defaults.radius;
          defaults.pendingLang = defaults.lang;
          defaults.pendingPush = defaults.push;
          defaults.pendingMessages = defaults.messages;
          defaults.pendingPromos = defaults.promos;
          defaults.pendingSound = defaults.sound;
          defaults.pendingVibration = defaults.vibration;
        }
      } catch (_) {}

      return defaults;
    }

    // Two 100% separate, independent device apps
    const apps = {
      android: createDeviceState('android'),
      ios: createDeviceState('ios')
    };

    function hasChanges(platform) {
      const s = apps[platform];
      return s.dark !== s.pendingDark ||
             s.accent.toLowerCase() !== s.pendingAccent.toLowerCase() ||
             s.textScale !== s.pendingTextScale ||
             s.radius !== s.pendingRadius ||
             s.lang !== s.pendingLang ||
             s.push !== s.pendingPush ||
             s.messages !== s.pendingMessages ||
             s.promos !== s.pendingPromos ||
             s.sound !== s.pendingSound ||
             s.vibration !== s.pendingVibration;
    }

    function getChangesCount(platform) {
      const s = apps[platform];
      let n = 0;
      if (s.dark !== s.pendingDark) n++;
      if (s.accent.toLowerCase() !== s.pendingAccent.toLowerCase()) n++;
      if (s.textScale !== s.pendingTextScale) n++;
      if (s.radius !== s.pendingRadius) n++;
      if (s.lang !== s.pendingLang) n++;
      if (s.push !== s.pendingPush) n++;
      if (s.messages !== s.pendingMessages) n++;
      if (s.promos !== s.pendingPromos) n++;
      if (s.sound !== s.pendingSound) n++;
      if (s.vibration !== s.pendingVibration) n++;
      return n;
    }

    function discardChanges(platform) {
      const s = apps[platform];
      s.pendingDark = s.dark;
      s.pendingAccent = s.accent;
      s.pendingTextScale = s.textScale;
      s.pendingRadius = s.radius;
      s.pendingLang = s.lang;
      s.pendingPush = s.push;
      s.pendingMessages = s.messages;
      s.pendingPromos = s.promos;
      s.pendingSound = s.sound;
      s.pendingVibration = s.vibration;
      s.showReview = false;
      renderDevice(platform);
    }

    let backendUser = {
      name: 'Yusuf Usmonov',
      email: 'usmonovyusuf693@gmail.com',
      phone: '+998 (90) 123-45-67',
      location: 'Toshkent shahri',
      avatar: 'YU',
      oneid_verified: true,
      skills: 'OneID Tasdiqlangan | Raqamli Fuqaro | E-Gov ID'
    };

    async function fetchBackendProfile() {
      try {
        const res = await fetch('http://localhost:8080/api/v1/profile', { signal: AbortSignal.timeout(3000) });
        if (!res.ok) return;
        const json = await res.json();
        const data = json.data;
        if (data) {
          backendUser.name = data.name || (data.user && data.user.name) || backendUser.name;
          backendUser.email = data.email || (data.user && data.user.email) || backendUser.email;
          backendUser.phone = data.phone || backendUser.phone;
          backendUser.location = data.location || backendUser.location;
          backendUser.oneid_verified = data.oneid_verified !== undefined ? data.oneid_verified : true;
          backendUser.skills = data.skills || backendUser.skills;
          
          const parts = backendUser.name.split(' ').filter(Boolean);
          backendUser.avatar = parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : backendUser.name.substring(0, 2).toUpperCase();

          const s = data.settings || (data.profile && data.profile.settings);
          if (s) {
            ['android', 'ios'].forEach(p => {
              if (s.dark_mode !== undefined) { apps[p].dark = s.dark_mode; apps[p].pendingDark = s.dark_mode; }
              if (s.accent_color) { apps[p].accent = s.accent_color; apps[p].pendingAccent = s.accent_color; }
              if (s.font_scale) { apps[p].textScale = parseFloat(s.font_scale); apps[p].pendingTextScale = parseFloat(s.font_scale); }
              if (s.corner_radius) { apps[p].radius = parseInt(s.corner_radius); apps[p].pendingRadius = parseInt(s.corner_radius); }
              if (s.language) { apps[p].lang = s.language; apps[p].pendingLang = s.language; }
              if (s.push_notifications !== undefined) { apps[p].push = s.push_notifications; apps[p].pendingPush = s.push_notifications; }
              if (s.sound_enabled !== undefined) { apps[p].sound = s.sound_enabled; apps[p].pendingSound = s.sound_enabled; }
              if (s.vibration_enabled !== undefined) { apps[p].vibration = s.vibration_enabled; apps[p].pendingVibration = s.vibration_enabled; }
            });
          }
          renderAll();
        }
      } catch (err) {
        console.warn('Backend sync warning:', err);
      }
    }

    function showToast(msg) {
      const existing = document.getElementById('settingsGlobalToast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'settingsGlobalToast';
      toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-2xl bg-emerald-600 text-white font-bold text-xs shadow-2xl flex items-center gap-2 animate-bounce';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-sm"></i><span>${msg}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => toast && toast.remove(), 3500);
    }

    async function saveChanges(platform) {
      const s = apps[platform];
      s.dark = s.pendingDark;
      s.accent = s.pendingAccent;
      s.textScale = s.pendingTextScale;
      s.radius = s.pendingRadius;
      s.lang = s.pendingLang;
      s.push = s.pendingPush;
      s.messages = s.pendingMessages;
      s.promos = s.pendingPromos;
      s.sound = s.pendingSound;
      s.vibration = s.pendingVibration;
      s.showReview = false;

      try {
        localStorage.setItem('workhub_app_state_' + platform, JSON.stringify({
          dark: s.dark,
          accent: s.accent,
          textScale: s.textScale,
          radius: s.radius,
          lang: s.lang,
          push: s.push,
          messages: s.messages,
          promos: s.promos,
          sound: s.sound,
          vibration: s.vibration
        }));
      } catch (_) {}

      // Real backend sync: Persist to Go backend API + PostgreSQL
      try {
        const res = await fetch('http://localhost:8080/api/v1/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            settings: {
              dark_mode: s.dark,
              accent_color: s.accent,
              font_scale: s.textScale,
              corner_radius: s.radius,
              language: s.lang,
              push_notifications: s.push,
              notify_messages: s.messages,
              notify_promos: s.promos,
              sound_enabled: s.sound,
              vibration_enabled: s.vibration
            }
          })
        });
        if (res.ok) {
          showToast(`✅ [${platform.toUpperCase()}] Sozlamalar backend bazasiga muvaffaqiyatli saqlandi!`);
        } else {
          showToast(`⚠️ Mahalliy saqlandi (${platform.toUpperCase()})`);
        }
      } catch (_) {
        showToast(`⚠️ Mahalliy saqlandi (${platform.toUpperCase()})`);
      }

      renderDevice(platform);
    }

    function resetDevice(platform) {
      try {
        localStorage.removeItem('workhub_app_state_' + platform);
      } catch (_) {}
      apps[platform] = createDeviceState(platform);
      renderDevice(platform);
    }

    function resetToDefaults() {
      resetDevice('android');
      resetDevice('ios');
    }

    function navigate(platform, route) {
      apps[platform].currentRoute = route;
      renderDevice(platform);
    }

    function setPendingAccent(platform, hex) {
      apps[platform].pendingAccent = hex;
      renderDevice(platform);
    }

    function setPendingTextScale(platform, scale) {
      apps[platform].pendingTextScale = scale;
      renderDevice(platform);
    }

    function setPendingRadius(platform, r) {
      apps[platform].pendingRadius = r;
      renderDevice(platform);
    }

    function setPendingLang(platform, code) {
      apps[platform].pendingLang = code;
      renderDevice(platform);
    }

    function toggleNotification(platform, prop, val) {
      apps[platform][prop] = val;
      renderDevice(platform);
    }

    function setReviewOpen(platform, isOpen) {
      apps[platform].showReview = isOpen;
      renderDevice(platform);
    }

    // Circular Reveal Animation running ONLY on that specific device
    function togglePendingDark(platform, checked, event, elInput) {
      const s = apps[platform];
      if (s.isAnimating) return;
      s.isAnimating = true;

      const targetDark = checked;
      const screenId = platform === 'android' ? 'androidScreen' : 'iosScreen';
      const screen = document.getElementById(screenId);

      // Generate incoming HTML for ONLY this platform
      s.pendingDark = targetDark;
      const incomingHTML = renderScreen(platform);
      s.pendingDark = !targetDark; // keep old theme active while circle expands

      if (screen) {
        const screenRect = screen.getBoundingClientRect();
        
        // Find visible switch element
        let targetEl = elInput;
        if (targetEl && targetEl.closest) {
          targetEl = targetEl.closest('label')?.querySelector('.w-12') || targetEl.closest('label') || targetEl;
        }

        let originX = screenRect.width - 50;
        let originY = 125;

        if (targetEl && typeof targetEl.getBoundingClientRect === 'function') {
          const swRect = targetEl.getBoundingClientRect();
          originX = (swRect.left + swRect.width / 2) - screenRect.left;
          originY = (swRect.top + swRect.height / 2) - screenRect.top;
        } else if (event && event.clientX) {
          originX = event.clientX - screenRect.left;
          originY = event.clientY - screenRect.top;
        }

        const maxRadius = Math.hypot(
          Math.max(originX, screenRect.width - originX),
          Math.max(originY, screenRect.height - originY)
        ) + 60;

        // Create overlay matched to current scroll viewport
        const overlay = document.createElement('div');
        overlay.className = 'absolute z-50 overflow-hidden pointer-events-none flex flex-col';
        overlay.style.top = screen.scrollTop + 'px';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = screen.clientHeight + 'px';
        overlay.style.clipPath = `circle(0px at ${originX}px ${originY}px)`;
        overlay.style.willChange = 'clip-path';
        overlay.innerHTML = incomingHTML;
        overlay.scrollTop = screen.scrollTop;

        screen.appendChild(overlay);

        // Hardware-accelerated Web Animations API (guaranteed smooth animation)
        const anim = overlay.animate([
          { clipPath: `circle(0px at ${originX}px ${originY}px)` },
          { clipPath: `circle(${maxRadius}px at ${originX}px ${originY}px)` }
        ], {
          duration: 620,
          easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
          fill: 'forwards'
        });

        // Glowing wave border expanding with the circle
        const ring = document.createElement('div');
        ring.style.position = 'absolute';
        ring.style.top = screen.scrollTop + 'px';
        ring.style.left = '0';
        ring.style.width = '100%';
        ring.style.height = screen.clientHeight + 'px';
        ring.style.pointerEvents = 'none';
        ring.style.zIndex = '55';
        screen.appendChild(ring);

        const ringAnim = ring.animate([
          {
            boxShadow: `inset 0 0 0 2px ${s.pendingAccent}`,
            clipPath: `circle(0px at ${originX}px ${originY}px)`,
            opacity: 1
          },
          {
            boxShadow: `inset 0 0 25px 8px ${s.pendingAccent}`,
            clipPath: `circle(${maxRadius}px at ${originX}px ${originY}px)`,
            opacity: 0
          }
        ], {
          duration: 620,
          easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)'
        });

        ringAnim.onfinish = () => ring.remove();

        anim.onfinish = () => {
          s.pendingDark = targetDark;
          const currentScroll = screen.scrollTop;
          renderDevice(platform);
          screen.scrollTop = currentScroll;
          overlay.remove();
          s.isAnimating = false;
        };

        <div class="flex-1 flex flex-col ${bgClass} relative transition-colors duration-500 ease-out">
          ${mainBody}
          ${bottomBarHTML}
          ${reviewSheetHTML}
        </div>
      `;
    }

    function renderDevice(platform) {
      const screenId = platform === 'android' ? 'androidScreen' : 'iosScreen';
      const screen = document.getElementById(screenId);
      if (screen) {
        screen.innerHTML = renderScreen(platform);
      }
    }

    function renderAll() {
      renderDevice('android');
      renderDevice('ios');

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const aClock = document.getElementById('androidClock');
      const iClock = document.getElementById('iosClock');
      if (aClock) aClock.innerText = timeStr;
      if (iClock) iClock.innerText = timeStr;
    }

    // Initial render
    renderAll();
    fetchBackendProfile();
  </script>
</body>
</html>
