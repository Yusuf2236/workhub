services:
  postgres:
    image: postgres:16-alpine
    container_name: workhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-workhub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-workhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workhub_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workhub_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-workhub}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see .env.production.example)}
      - ONEID_ENCRYPTION_KEY=${ONEID_ENCRYPTION_KEY:?ONEID_ENCRYPTION_KEY must be set (see .env.production.example)}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ONEID_CLIENT_ID=${ONEID_CLIENT_ID:-workhub}
      - ONEID_CLIENT_SECRET=${ONEID_CLIENT_SECRET:-}
      - ONEID_REDIRECT_URI=${ONEID_REDIRECT_URI:-}
      - ONEID_QR_ENABLED=${ONEID_QR_ENABLED:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID:-}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID:-}
      - CLICK_SECRET_KEY=${CLICK_SECRET_KEY:-}
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID:-}
      - PAYME_KEY=${PAYME_KEY:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-}
      - HH_APP_TOKEN=${HH_APP_TOKEN:-}
      - HH_CLIENT_ID=${HH_CLIENT_ID:-}
      - HH_CLIENT_SECRET=${HH_CLIENT_SECRET:-}
      - HH_USER_AGENT=${HH_USER_AGENT:-WZone/1.0}
      - SCRAPER_INTERVAL=${SCRAPER_INTERVAL:-1m}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - JWT_TTL=${JWT_TTL:-168h}
    # Reached through nginx (/api/); the port is only open on the server itself
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: workhub_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Must be reachable from the admin's browser, not from inside Docker
        NEXT_PUBLIC_API_URL: ${ADMIN_PUBLIC_API_URL:-}
        # nginx serves the admin at https://<site>/admin
        ADMIN_BASE_PATH: /admin
    container_name: workhub_admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "127.0.0.1:3001:3001"

  nginx:
    image: nginx:alpine
    container_name: workhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf serves plain HTTP; switch to nginx-https.conf once a certificate exists
      # (NGINX_CONF=nginx-https.conf, see docs/deploy.md)
      - ./infra/docker/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx-locations.conf:/etc/nginx/locations.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    # Reload every 12h so renewed certificates are picked up
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      - web
      - backend
      - admin

  # Renews the Let's Encrypt certificate (start with: docker compose --profile https up -d)
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: workhub_certbot
    restart: unless-stopped
    profiles: ["https"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  # Daily PostgreSQL dump into ./backups, keeping BACKUP_KEEP_DAYS days (copy them off the server too)
  backup:
    image: postgres:16-alpine
    container_name: workhub_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER:-postgres}
      - PGPASSWORD=${DB_PASSWORD:-postgres}
      - PGDATABASE=${DB_NAME:-workhub}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          file=/backups/workhub-$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "[backup] saved $$file"
          else
            rm -f "$$file.tmp"
            echo "[backup] pg_dump FAILED" >&2
          fi
          find /backups -name 'workhub-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:
