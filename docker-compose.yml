version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wzone_backend
    restart: unless-stopped
    ports:
      - "${PORT_BIND:-18090}:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_ENV=production
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-wzone}
      - DB_SSLMODE=disable
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-wzone_secret_key_2026}
      - ONEID_ENCRYPTION_KEY=${ONEID_ENCRYPTION_KEY:-wzone_aes_256_gcm_secret_key_2026}
    volumes:
      - ./uploads:/app/uploads
