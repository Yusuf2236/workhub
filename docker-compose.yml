name: wzone-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://wzone_backend:8080
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: wzone_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-13000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_INTERNAL_URL: http://wzone_backend:8080
      INTERNAL_API_URL: http://wzone_backend:8080/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    env_file:
      - path: .env.prod
        required: false
    networks:
      - wzone_net

networks:
  wzone_net:
    external: true
