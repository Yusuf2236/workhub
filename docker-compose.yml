services:
  postgres:
    image: postgres:16-alpine
    container_name: workhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-workhub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-workhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workhub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workhub_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-workhub}
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see .env.production.example)}
      - ONEID_ENCRYPTION_KEY=${ONEID_ENCRYPTION_KEY:?ONEID_ENCRYPTION_KEY must be set (see .env.production.example)}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ONEID_CLIENT_ID=${ONEID_CLIENT_ID:-workhub}
      - ONEID_CLIENT_SECRET=${ONEID_CLIENT_SECRET:-}
      - ONEID_REDIRECT_URI=${ONEID_REDIRECT_URI:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CLICK_SERVICE_ID=${CLICK_SERVICE_ID:-}
      - CLICK_MERCHANT_ID=${CLICK_MERCHANT_ID:-}
      - CLICK_SECRET_KEY=${CLICK_SECRET_KEY:-}
      - PAYME_MERCHANT_ID=${PAYME_MERCHANT_ID:-}
      - PAYME_KEY=${PAYME_KEY:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: workhub_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Must be reachable from the admin's browser, not from inside Docker
        NEXT_PUBLIC_API_URL: ${ADMIN_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: workhub_admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    container_name: workhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - backend

volumes:
  postgres_data:
  redis_data:
